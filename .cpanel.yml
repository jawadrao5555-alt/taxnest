---
deployment:
  tasks:
    # Task 711: all deploy logic lives in scripts/cpanel-autodeploy.sh so the
    # whole apply happens inside a friendly maintenance window (200 "Updating…"
    # page) with caches cleared BEFORE users can hit new views against a stale
    # route cache. Runs with cwd = this repo clone; script traps `artisan up`.
    #
    # TRIGGER REALITY (Task 1053, Aug 17 2026): this file runs ONLY when a
    # cPanel "Pull or Deploy" task fires (manual click in cPanel Git UI). The
    # GitHub repo has NO webhook, so a plain `git push origin main` deploys
    # NOTHING by itself. deploy-live.sh is the authoritative deploy path; the
    # post-merge check (scripts/check-live-deploy.sh) trips loudly when live
    # code is newer than its caches.
    - /bin/bash scripts/cpanel-autodeploy.sh
