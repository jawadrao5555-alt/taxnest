# Poll approved relay requests and hand them to the guarded owner workflow.
# The relay authenticates this job with GitHub OIDC and returns only claims
# bound to this repository, PR, and exact head SHA.
#
# Empty relay bodies are treated as zero claims (schedule poller success).
# Non-JSON HTML still fails closed.
name: Approval Relay Dispatch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: approval-relay-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Claim approved requests and dispatch owner handoff
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_APPROVAL_RELAY_URL: https://taxnest.pk
        run: |
          set -euo pipefail
          TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=owner-approval-relay" | jq -r .value)"
          jq -n --arg repo "$GITHUB_REPOSITORY" '{repository:$repo}' > /tmp/dispatch-request.json
          HTTP=$(curl --fail --silent --show-error \
            -o /tmp/claims.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary @/tmp/dispatch-request.json \
            "${OWNER_APPROVAL_RELAY_URL%/}/api/deployment-approval/v1/dispatch-claims")
          echo "relay HTTP $HTTP bytes=$(wc -c < /tmp/claims.json)"
          python3 scripts/lib/approval_dispatch_claims.py /tmp/claims.json > /tmp/claims.tsv
          while IFS=$'\t' read -r request pull sha; do
            [ -n "$request" ] || continue
            gh workflow run owner-merge-and-deploy.yml --repo "$GITHUB_REPOSITORY" \
              -f "pull_number=$pull" -f "expected_head_sha=$sha" \
              -f "approval_request_id=$request"
          done < /tmp/claims.tsv
