# Poll approved relay requests and hand them to the guarded owner workflow.
# The relay authenticates this job with GitHub OIDC and returns only claims
# bound to this repository, PR, and exact head SHA.
#
# Empty relay bodies are treated as zero claims (schedule poller success).
# Non-JSON HTML still fails closed.
#
# GitHub cron is NOT a guaranteed timer. Historical scheduled gaps on this
# workflow have been 1-5 hours even with staggered crons (see run #38 →
# manual #39). Immediate Admin→GitHub dispatch would need a GitHub App
# installation token with actions:write. This workflow does not invent or
# store that credential. workflow_dispatch remains the owner emergency wake-up.
name: Approval Relay Dispatch

# GitHub limits each individual schedule to a five-minute cadence. Five
# staggered, individually-valid schedules make approval pickup normally happen
# within about one minute when GitHub actually fires the scheduler. They do
# not add a PAT, production GitHub credential, or weaken the OIDC-bound claim.
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: approval-relay-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Claim approved requests and dispatch owner handoff
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_APPROVAL_RELAY_URL: https://taxnest.pk
        run: |
          set -euo pipefail
          TOKEN="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=owner-approval-relay" | jq -r .value)"
          jq -n --arg repo "$GITHUB_REPOSITORY" '{repository:$repo}' > /tmp/dispatch-request.json
          HTTP=$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/claims.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary @/tmp/dispatch-request.json \
            "${OWNER_APPROVAL_RELAY_URL%/}/api/deployment-approval/v1/dispatch-claims")
          echo "relay HTTP $HTTP bytes=$(wc -c < /tmp/claims.json)"
          python3 scripts/lib/approval_dispatch_claims.py /tmp/claims.json > /tmp/claims.tsv
          while IFS=$'\t' read -r request pull sha; do
            [ -n "$request" ] || continue
            dispatched=0
            for attempt in 1 2 3; do
              if gh workflow run owner-merge-and-deploy.yml --repo "$GITHUB_REPOSITORY" \
                -f "pull_number=$pull" -f "expected_head_sha=$sha" \
                -f "approval_request_id=$request"; then
                dispatched=1
                break
              fi
              sleep $((attempt * 2))
            done
            if [ "$dispatched" -ne 1 ]; then
              echo "Dispatch failed after 3 attempts; short lease will retry automatically." >&2
              exit 1
            fi
          done < /tmp/claims.tsv
