name: Build PRA Agent (Windows)
on:
  push:
    branches:
      - main
    paths:
      - 'pra-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-pra-agent
  cancel-in-progress: false
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pra-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: agent-version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid agent semver: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm install
      - run: npm run build:win
      - name: Zip portable folder
        shell: pwsh
        run: |
          if (Test-Path dist/win-unpacked) {
            Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/TaxNest-PRA-Agent-Windows.zip -Force
          }
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.agent-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TaxNest PRA Agent v${{ steps.agent-version.outputs.version }}
          body_path: pra-agent/CHANGELOG.md
          files: |
            pra-agent/dist/*.exe
            pra-agent/dist/TaxNest-PRA-Agent-Windows.zip
          draft: false
          prerelease: false
          make_latest: true
