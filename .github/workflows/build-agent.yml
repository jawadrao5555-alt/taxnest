name: Build PRA Agent (Windows)
run-name: Build PRA Agent — ${{ inputs.target_sha || github.sha }}
on:
  push:
    branches:
      - main
    paths:
      - 'pra-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact main commit to package (blank means workflow ref)"
        required: false
        type: string
      approval_request_id:
        description: "Owner approval correlation ID, when dispatched after merge"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: build-pra-agent-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: false
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pra-agent
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact requested source commit
        id: release-source
        shell: pwsh
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($env:REQUESTED_SHA) {
            if ($env:REQUESTED_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw "target_sha must be a full 40-character SHA" }
            if ($actual -ne $env:REQUESTED_SHA.ToLowerInvariant()) { throw "Checked out $actual, expected $env:REQUESTED_SHA" }
          }
          git merge-base --is-ancestor $actual origin/main
          if ($LASTEXITCODE -ne 0) { throw "Requested source is not on main" }
          "target_sha=$actual" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: agent-version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid agent semver: $version" }
          $tag = "v$version"
          git show-ref --verify --quiet "refs/tags/$tag"
          $tagLookup = $LASTEXITCODE
          if ($tagLookup -eq 0) {
            $tagTarget = (git rev-list -n 1 $tag).Trim().ToLowerInvariant()
            $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
            if ($tagTarget -ne $actual) { throw "Release $tag already belongs to $tagTarget; bump package version" }
            "already_released=true" >> $env:GITHUB_OUTPUT
          } elseif ($tagLookup -eq 1) {
            "already_released=false" >> $env:GITHUB_OUTPUT
          } else {
            throw "git show-ref failed with exit code $tagLookup while looking up $tag"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
      - if: ${{ steps.agent-version.outputs.already_released != 'true' }}
        run: npm install
      - if: ${{ steps.agent-version.outputs.already_released != 'true' }}
        run: npm run build:win
      - name: Zip portable folder
        if: ${{ steps.agent-version.outputs.already_released != 'true' }}
        shell: pwsh
        run: |
          if (Test-Path dist/win-unpacked) {
            Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/TaxNest-PRA-Agent-Windows.zip -Force
          }
      - name: Upload to release
        if: ${{ steps.agent-version.outputs.already_released != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.agent-version.outputs.version }}
          target_commitish: ${{ steps.release-source.outputs.target_sha }}
          name: TaxNest PRA Agent v${{ steps.agent-version.outputs.version }}
          body_path: pra-agent/CHANGELOG.md
          files: |
            pra-agent/dist/*.exe
            pra-agent/dist/TaxNest-PRA-Agent-Windows.zip
          draft: false
          prerelease: false
          make_latest: true
      - name: Report idempotent existing release
        if: ${{ steps.agent-version.outputs.already_released == 'true' }}
        shell: pwsh
        run: Write-Host "Agent v${{ steps.agent-version.outputs.version }} is already released from this exact SHA; no assets were replaced."
