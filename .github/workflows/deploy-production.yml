# Deploy production (Nayatel VPS) via GitHub Actions
#
# Triggers:
#   1) push to main — human merges / non-GITHUB_TOKEN pushes
#   2) workflow_dispatch with inputs.target_sha — required handoff after
#      Enable PR auto-merge squash (GITHUB_TOKEN merges suppress push workflows;
#      workflow_dispatch is exempt). target_sha MUST be the exact squash commit.
#
# Flow:
#   → job "gate" (no Environment, no secrets): resolve SHA, require it equals
#     current origin/main TIP, cancel other runs WAITING for production approval
#   → job "deploy": GitHub Environment "production" required reviewers (MANUAL)
#   → SSH as taxnest-production-deploy → insert deploy/elaan.yml (if present)
#   → Elaan freshness gate → apply exact TARGET_SHA on the VPS
#   → post-deploy live verification (scripts/ci-live-verify.sh)
#
# Safety:
#   - Never pushes to main (or any branch)
#   - Never embeds private keys, passwords, tokens, or .env values
#   - Uses scripts/lib/live-known-hosts with StrictHostKeyChecking=yes
#   - Does not use the Replit key (.local/ssh/nayatel_vps_key)
#   - gate concurrency (production-deploy-gate, cancel-in-progress: true) lets a
#     newer tip supersede an older pre-apply run; does NOT cancel in-flight SSH
#   - deploy concurrency (production-deploy, cancel-in-progress: false) serializes
#     Environment-approved SSH/apply. NEVER set cancel-in-progress: true here.
#   - Non-tip SHA fails closed BEFORE Environment approval and BEFORE SSH
#   - Stale approved SHA fails closed again immediately before SSH
#   - Live QA password stays in Environment secret LIVE_QA_PASS
#   - Deploy SHA is pinned (push: github.sha / dispatch: inputs.target_sha)
#
# Required Environment secrets:
#   PRODUCTION_SSH_PRIVATE_KEY
#   LIVE_QA_PASS
#
# Docs: docs/ops/github-production-deploy.md
# Issue→live: docs/ops/cloud-agent-issue-to-live.md
# Rollback: deployment/ROLLBACK.md

name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact current origin/main commit SHA to deploy (auto-merge handoff). Non-tip SHAs fail closed. Leave empty only for emergency tip-of-main dispatch (still fail-closed if main moved)."
        type: string
        required: false
        default: ""
      skip_elaan:
        description: "Emergency only — skip Elaan (What's New) freshness gate"
        type: boolean
        default: false
      allow_settings:
        description: "Comma-separated settings columns this deploy may intentionally change"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gate:
    name: Refuse stale / non-tip SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    concurrency:
      group: production-deploy-gate
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve exact deploy SHA
        id: resolve
        run: |
          set -euo pipefail
          EVENT="${GITHUB_EVENT_NAME}"
          INPUT_SHA="${{ github.event.inputs.target_sha || '' }}"
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_SHA" ]; then
            case "$INPUT_SHA" in
              *[!0-9a-fA-F]*|"")
                echo "Invalid target_sha input: ${INPUT_SHA}" >&2
                exit 1
                ;;
            esac
            if [ "${#INPUT_SHA}" -ne 40 ]; then
              echo "target_sha must be a full 40-char commit SHA (got ${#INPUT_SHA} chars)" >&2
              exit 1
            fi
            echo "Deploy SHA source=workflow_dispatch inputs.target_sha"
            echo "sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            echo "Deploy SHA source=push github.sha"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Deploy SHA source=workflow_dispatch empty target_sha → github.sha (emergency; still must equal origin/main tip at run time)"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported event ${EVENT}" >&2
            exit 1
          fi

      - name: Checkout exact deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Guard — refuse wrong SHA / non-main history / non-tip
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ steps.resolve.outputs.sha }}"
          echo "github.event_name=${GITHUB_EVENT_NAME}"
          echo "github.ref=${GITHUB_REF}"
          echo "DEPLOY_SHA=${DEPLOY_SHA}"
          echo "checkout HEAD=$(git rev-parse HEAD)"
          # shellcheck source=scripts/lib/deploy-main-tip-guard.sh
          source scripts/lib/deploy-main-tip-guard.sh
          deploy_guard_main_tip "$DEPLOY_SHA" "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"

      - name: Cancel stale Environment-waiting Deploy Production runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/lib/cancel-stale-waiting-production-deploys.sh

  deploy:
    name: Deploy main commit to production
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Pin SHA from gate
        id: resolve
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ needs.gate.outputs.sha }}"
          INPUT_SHA="${{ github.event.inputs.target_sha || '' }}"
          case "$DEPLOY_SHA" in
            *[!0-9a-fA-F]*|"")
              echo "Gate did not output a valid SHA" >&2
              exit 1
              ;;
          esac
          if [ "${#DEPLOY_SHA}" -ne 40 ]; then
            echo "Gate SHA must be 40 chars" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$INPUT_SHA" ]; then
            if [ "$INPUT_SHA" != "$DEPLOY_SHA" ]; then
              echo "Refusing deploy: gate SHA $DEPLOY_SHA != inputs.target_sha $INPUT_SHA" >&2
              exit 1
            fi
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$DEPLOY_SHA" != "$GITHUB_SHA" ]; then
            echo "Refusing deploy: gate SHA $DEPLOY_SHA != github.sha $GITHUB_SHA" >&2
            exit 1
          fi
          echo "sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Guard — refuse stale SHA after Environment approval (before SSH)
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ steps.resolve.outputs.sha }}"
          echo "github.event_name=${GITHUB_EVENT_NAME}"
          echo "github.ref=${GITHUB_REF}"
          echo "DEPLOY_SHA=${DEPLOY_SHA}"
          echo "checkout HEAD=$(git rev-parse HEAD)"
          # shellcheck source=scripts/lib/deploy-main-tip-guard.sh
          source scripts/lib/deploy-main-tip-guard.sh
          deploy_guard_main_tip "$DEPLOY_SHA" "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"

      - name: Deploy exact commit over SSH
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SKIP_ELAAN: ${{ github.event.inputs.skip_elaan || 'false' }}
          ALLOW_SETTINGS: ${{ github.event.inputs.allow_settings || '' }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_SSH_PRIVATE_KEY}" ]; then
            echo "PRODUCTION_SSH_PRIVATE_KEY is empty — configure it on the GitHub Environment 'production'." >&2
            exit 1
          fi
          EXTRA_ARGS=()
          if [ "${SKIP_ELAAN}" = "true" ] || [ "${SKIP_ELAAN}" = "1" ]; then
            EXTRA_ARGS+=(--no-elaan)
          fi
          if [ -n "${ALLOW_SETTINGS}" ]; then
            EXTRA_ARGS+=(--allow-settings="${ALLOW_SETTINGS}")
          fi
          bash scripts/ci-deploy-production.sh --target-sha="${TARGET_SHA}" "${EXTRA_ARGS[@]}"

      - name: Post-deploy live verification (SHA + NestPOS markers)
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          LIVE_QA_PASS: ${{ secrets.LIVE_QA_PASS }}
          LIVE_URL: https://taxnest.pk
          LIVE_VERIFY_PROFILE: extended
        run: bash scripts/ci-live-verify.sh
