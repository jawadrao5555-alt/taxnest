# Deploy production (Nayatel VPS) via GitHub Actions
#
# Triggers:
#   workflow_dispatch with REQUIRED inputs.target_sha — the ONLY production
#   start path. Owner Merge & Deploy squash-merges then dispatches this
#   workflow with the exact squash SHA. No on.push: GitHub Merge / Squash /
#   Rebase cannot auto-deploy. Empty target_sha is refused (no github.sha
#   emergency fallback). Do not re-add on.push.
#
# Flow:
#   → job "gate" (no Environment, no secrets): resolve SHA, refuse GitHub
#     merge-commits / "Merge pull request #N" subjects, require SHA equals
#     current origin/main TIP, refuse skip_elaan/allow_settings, cancel other
#     runs WAITING for an Environment (legacy production reviewers or a
#     re-added wait)
#   → job "deploy": GitHub Environment "production-deploy" (secrets + main-only
#     branch policy; NO required reviewers — protection is repository gates)
#   → SSH as taxnest-production-deploy → insert deploy/elaan.yml (if present)
#   → Elaan freshness gate → apply exact TARGET_SHA on the VPS
#   → post-deploy live verification (scripts/ci-live-verify.sh)
#
# Safety:
#   - Never pushes to main (or any branch)
#   - Never embeds private keys, passwords, tokens, or .env values
#   - Uses scripts/lib/live-known-hosts with StrictHostKeyChecking=yes
#   - Does not use the Replit key (.local/ssh/nayatel_vps_key)
#   - gate concurrency (production-deploy-gate, cancel-in-progress: true) lets a
#     newer tip supersede an older pre-apply run; does NOT cancel in-flight SSH
#   - deploy concurrency (production-deploy, cancel-in-progress: false) serializes
#     Environment-scoped SSH/apply. NEVER set cancel-in-progress: true here.
#   - Non-tip SHA fails closed BEFORE Environment secrets and BEFORE SSH
#   - Stale SHA fails closed again immediately before SSH
#   - Live QA password stays in Environment secret LIVE_QA_PASS
#   - Deploy SHA is pinned to required workflow_dispatch inputs.target_sha
#     (40-char hex, must equal origin/main tip). Empty SHA and push events
#     are refused. No github.sha emergency fallback.
#   - skip_elaan and allow_settings are refused on this workflow (fail-closed).
#     Emergency Elaan skip / settings-column allow-list is the owner workstation
#     path: scripts/deploy-live.sh. Do not re-enable those inputs on the
#     unattended path.
#   - Environment "production" (required reviewers) is reserved for Live Ops.
#     Do not point this workflow back at "production" — that reintroduces the
#     human approval bottleneck and couples deploy to Live Ops reviewers.
#   - Never auto-approve Environment deployments with a GitHub token.
#
# Required Environment secrets (GitHub Environment name: production-deploy):
#   PRODUCTION_SSH_PRIVATE_KEY
#   LIVE_QA_PASS
#
# Docs: docs/ops/github-production-deploy.md
# Issue→live: docs/ops/cloud-agent-issue-to-live.md
# Rollback: deployment/ROLLBACK.md

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "REQUIRED 40-char origin/main tip SHA from Owner Merge & Deploy. Empty / github.sha fallback is refused."
        type: string
        required: true
      skip_elaan:
        description: "REFUSED — emergency Elaan skip is not allowed on the unattended Deploy Production path. Use scripts/deploy-live.sh on an owner workstation."
        type: boolean
        default: false
      allow_settings:
        description: "REFUSED — settings-column allow-list is not allowed on the unattended Deploy Production path. Use scripts/deploy-live.sh on an owner workstation."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gate:
    name: Refuse stale / non-tip SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    concurrency:
      group: production-deploy-gate
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve exact deploy SHA
        id: resolve
        run: |
          set -euo pipefail
          EVENT="${GITHUB_EVENT_NAME}"
          INPUT_SHA="$(printf '%s' "${{ github.event.inputs.target_sha || '' }}" | tr 'A-F' 'a-f')"
          if [ "$EVENT" = "push" ]; then
            echo "CI DEPLOY FAILED: Deploy Production does not run on push." >&2
            echo "Use Actions workflow Owner Merge & Deploy (squash + exact-SHA dispatch)." >&2
            echo "Do not click Merge / Squash / Rebase on the PR page." >&2
            exit 1
          fi
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "Unsupported event ${EVENT}" >&2
            exit 1
          fi
          if [ -z "$INPUT_SHA" ]; then
            echo "CI DEPLOY FAILED: target_sha is required. Empty github.sha emergency dispatch is refused." >&2
            echo "Owner Merge & Deploy must pass the exact squash SHA. Workstation emergency is scripts/deploy-live.sh." >&2
            exit 1
          fi
          case "$INPUT_SHA" in
            *[!0-9a-f]*|"")
              echo "Invalid target_sha input: ${INPUT_SHA}" >&2
              exit 1
              ;;
          esac
          if [ "${#INPUT_SHA}" -ne 40 ]; then
            echo "target_sha must be a full 40-char commit SHA (got ${#INPUT_SHA} chars)" >&2
            exit 1
          fi
          echo "Deploy SHA source=workflow_dispatch inputs.target_sha"
          echo "sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Guard — refuse skip_elaan / allow_settings on the unattended path
        run: |
          set -euo pipefail
          SKIP="${{ github.event.inputs.skip_elaan || 'false' }}"
          ALLOW="${{ github.event.inputs.allow_settings || '' }}"
          if [ "$SKIP" = "true" ] || [ "$SKIP" = "1" ]; then
            echo "CI DEPLOY FAILED: skip_elaan is refused on unattended Deploy Production." >&2
            echo "Elaan freshness stays fail-closed. Emergency skip is scripts/deploy-live.sh --no-elaan on an owner workstation (not this workflow, not a Cloud Agent)." >&2
            exit 1
          fi
          if [ -n "$ALLOW" ]; then
            echo "CI DEPLOY FAILED: allow_settings is refused on unattended Deploy Production." >&2
            echo "A settings-column mutation must fail closed here. Emergency allow-list is scripts/deploy-live.sh --allow-settings=... on an owner workstation." >&2
            exit 1
          fi
          echo "Unattended path OK — skip_elaan false, allow_settings empty."

      - name: Checkout exact deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Guard — refuse GitHub PR merge-commit deploys
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --format=%s)"
          PARENTS="$(git rev-list --parents -n 1 HEAD | awk '{print NF-1}')"
          if [ "${PARENTS}" -gt 1 ] || printf '%s' "${SUBJECT}" | grep -Eq '^Merge pull request #[0-9]+'; then
            echo "CI DEPLOY FAILED: GitHub PR Merge-button / merge-commit deploys are refused." >&2
            echo "Use Actions workflow Owner Merge & Deploy (squash + exact-SHA dispatch)." >&2
            echo "Do not click Merge on the PR page when that workflow is available." >&2
            echo "  HEAD=$(git rev-parse HEAD)" >&2
            echo "  parents=${PARENTS}" >&2
            echo "  subject=${SUBJECT}" >&2
            exit 1
          fi
          echo "Deploy SHA is not a GitHub merge commit (parents=${PARENTS})."

      - name: Guard — refuse wrong SHA / non-main history / non-tip
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ steps.resolve.outputs.sha }}"
          echo "github.event_name=${GITHUB_EVENT_NAME}"
          echo "github.ref=${GITHUB_REF}"
          echo "DEPLOY_SHA=${DEPLOY_SHA}"
          echo "checkout HEAD=$(git rev-parse HEAD)"
          # shellcheck source=scripts/lib/deploy-main-tip-guard.sh
          source scripts/lib/deploy-main-tip-guard.sh
          deploy_guard_main_tip "$DEPLOY_SHA" "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"

      - name: Cancel stale Environment-waiting Deploy Production runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/lib/cancel-stale-waiting-production-deploys.sh

  deploy:
    name: Deploy main commit to production
    needs: gate
    runs-on: ubuntu-latest
    environment: production-deploy
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Pin SHA from gate
        id: resolve
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(printf '%s' "${{ needs.gate.outputs.sha }}" | tr 'A-F' 'a-f')"
          INPUT_SHA="$(printf '%s' "${{ github.event.inputs.target_sha || '' }}" | tr 'A-F' 'a-f')"
          SKIP="${{ github.event.inputs.skip_elaan || 'false' }}"
          ALLOW="${{ github.event.inputs.allow_settings || '' }}"
          case "$DEPLOY_SHA" in
            *[!0-9a-f]*|"")
              echo "Gate did not output a valid SHA" >&2
              exit 1
              ;;
          esac
          if [ "${#DEPLOY_SHA}" -ne 40 ]; then
            echo "Gate SHA must be 40 chars" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "Refusing deploy: only workflow_dispatch is allowed (got ${GITHUB_EVENT_NAME})" >&2
            exit 1
          fi
          if [ -z "$INPUT_SHA" ]; then
            echo "Refusing deploy: empty target_sha reached the SSH job" >&2
            exit 1
          fi
          if [ "$INPUT_SHA" != "$DEPLOY_SHA" ]; then
            echo "Refusing deploy: gate SHA $DEPLOY_SHA != inputs.target_sha $INPUT_SHA" >&2
            exit 1
          fi
          if [ "$SKIP" = "true" ] || [ "$SKIP" = "1" ]; then
            echo "Refusing deploy: skip_elaan reached the SSH job (gate should have refused)" >&2
            exit 1
          fi
          if [ -n "$ALLOW" ]; then
            echo "Refusing deploy: allow_settings reached the SSH job (gate should have refused)" >&2
            exit 1
          fi
          echo "sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Guard — refuse stale SHA after Environment start (before SSH)
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ steps.resolve.outputs.sha }}"
          echo "github.event_name=${GITHUB_EVENT_NAME}"
          echo "github.ref=${GITHUB_REF}"
          echo "DEPLOY_SHA=${DEPLOY_SHA}"
          echo "checkout HEAD=$(git rev-parse HEAD)"
          # shellcheck source=scripts/lib/deploy-main-tip-guard.sh
          source scripts/lib/deploy-main-tip-guard.sh
          deploy_guard_main_tip "$DEPLOY_SHA" "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"

      - name: Deploy exact commit over SSH
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SKIP_ELAAN: "false"
          ALLOW_SETTINGS: ""
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_SSH_PRIVATE_KEY}" ]; then
            echo "PRODUCTION_SSH_PRIVATE_KEY is empty — configure it on the GitHub Environment 'production-deploy' (not a repository secret, not Environment 'production')." >&2
            exit 1
          fi
          if [ "${SKIP_ELAAN}" != "false" ] && [ "${SKIP_ELAAN}" != "0" ]; then
            echo "SKIP_ELAAN must stay false on unattended Deploy Production" >&2
            exit 1
          fi
          if [ -n "${ALLOW_SETTINGS}" ]; then
            echo "ALLOW_SETTINGS must stay empty on unattended Deploy Production" >&2
            exit 1
          fi
          bash scripts/ci-deploy-production.sh --target-sha="${TARGET_SHA}"

      - name: Post-deploy live verification (SHA + NestPOS markers)
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          LIVE_QA_PASS: ${{ secrets.LIVE_QA_PASS }}
          LIVE_URL: https://taxnest.pk
          LIVE_VERIFY_PROFILE: extended
        run: bash scripts/ci-live-verify.sh
