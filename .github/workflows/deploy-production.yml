# Deploy production (Nayatel VPS) via GitHub Actions
#
# Trigger:
#   workflow_dispatch from Owner Merge & Deploy only, with a relay-bound run nonce.
#      Owner Merge & Deploy squash (GITHUB_TOKEN merges suppress push workflows;
#      workflow_dispatch is exempt). target_sha MUST be the exact squash commit.
#
# Flow:
#   → job "gate" (no Environment, no secrets): resolve SHA, require it equals
#     current origin/main TIP and cancel other
#     runs WAITING for an Environment (legacy production reviewers or a
#     re-added wait)
#   → job "deploy": GitHub Environment "production-deploy" (secrets + main-only
#     branch policy; NO required reviewers — protection is repository gates)
#   → SSH as taxnest-production-deploy → insert deploy/elaan.yml (if present)
#   → Elaan freshness gate → apply exact TARGET_SHA on the VPS
#   → post-deploy live verification (scripts/ci-live-verify.sh)
#
# Safety:
#   - Never pushes to main (or any branch)
#   - Never embeds private keys, passwords, tokens, or .env values
#   - Uses scripts/lib/live-known-hosts with StrictHostKeyChecking=yes
#   - Does not use the Replit key (.local/ssh/nayatel_vps_key)
#   - gate concurrency (production-deploy-gate, cancel-in-progress: true) lets a
#     newer tip supersede an older pre-apply run; does NOT cancel in-flight SSH
#   - deploy concurrency (production-deploy, cancel-in-progress: false) serializes
#     Environment-scoped SSH/apply. NEVER set cancel-in-progress: true here.
#   - Non-tip SHA fails closed BEFORE Environment secrets and BEFORE SSH
#   - Stale SHA fails closed again immediately before SSH
#   - Live QA password stays in Environment secret LIVE_QA_PASS
#   - Deploy SHA is pinned to the relay-authorized dispatch input
#   - Environment "production" (required reviewers) is reserved for Live Ops.
#     Do not point this workflow back at "production" — that reintroduces the
#     human approval bottleneck and couples deploy to Live Ops reviewers.
#   - Never auto-approve Environment deployments with a GitHub token.
#
# Required Environment secrets (GitHub Environment name: production-deploy):
#   PRODUCTION_SSH_PRIVATE_KEY
#   LIVE_QA_PASS
#
# Docs: docs/ops/github-production-deploy.md
# Issue→live: docs/ops/cloud-agent-issue-to-live.md
# Rollback: deployment/ROLLBACK.md

name: Deploy Production
run-name: Deploy Production — approval ${{ inputs.approval_request_id }} — nonce ${{ inputs.handoff_nonce }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact current origin/main commit SHA from the Owner Merge & Deploy handoff"
        type: string
        required: true
      approval_request_id:
        description: "Relay approval request bound to this deploy"
        type: string
        required: true
      handoff_nonce:
        description: "Lowercase 128-bit correlation nonce from Owner Merge & Deploy"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    name: Refuse stale / non-tip SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      id-token: write
    concurrency:
      group: production-deploy-gate
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Verify relay provenance (OIDC-bound registered run)
        env:
          OWNER_APPROVAL_RELAY_URL: https://taxnest.pk
          APPROVAL_REQUEST_ID: ${{ inputs.approval_request_id }}
          HANDOFF_NONCE: ${{ inputs.handoff_nonce }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=owner-approval-relay" | jq -r .value)"
          jq -n --arg id "$APPROVAL_REQUEST_ID" --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$TARGET_SHA" --arg nonce "$HANDOFF_NONCE" --arg run "$RUN_ID" --arg attempt "$RUN_ATTEMPT" \
            '{approval_request_id:$id,repository:$repo,target_sha:$sha,handoff_nonce:$nonce,run_id:($run|tonumber),run_attempt:($attempt|tonumber)}' > /tmp/relay-request.json
          for attempt in $(seq 1 30); do
            HTTP_CODE="$(curl --silent --show-error -o /tmp/relay-verification.json -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
              --data-binary @/tmp/relay-request.json \
              "${OWNER_APPROVAL_RELAY_URL%/}/api/deployment-approval/v1/provenance/verify")"
            if [ "$HTTP_CODE" = "200" ]; then break; fi
            if [ "$HTTP_CODE" != "409" ]; then
              echo "relay provenance failed HTTP ${HTTP_CODE}" >&2; cat /tmp/relay-verification.json >&2; exit 1
            fi
            sleep 2
          done
          [ "$HTTP_CODE" = "200" ] || { echo "relay provenance registration timeout" >&2; exit 1; }
          grep -q '"valid"[[:space:]]*:[[:space:]]*true' /tmp/relay-verification.json \
            || { echo "relay rejected deploy provenance" >&2; cat /tmp/relay-verification.json >&2; exit 1; }

      - name: Resolve exact deploy SHA
        id: resolve
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          EVENT="${GITHUB_EVENT_NAME}"
          INPUT_SHA="${TARGET_SHA}"
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_SHA" ]; then
            case "$INPUT_SHA" in
              *[!0-9a-fA-F]*|"")
                echo "Invalid target_sha input: ${INPUT_SHA}" >&2
                exit 1
                ;;
            esac
            if [ "${#INPUT_SHA}" -ne 40 ]; then
              echo "target_sha must be a full 40-char commit SHA (got ${#INPUT_SHA} chars)" >&2
              exit 1
            fi
            echo "Deploy SHA source=workflow_dispatch inputs.target_sha"
            echo "sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported event ${EVENT}" >&2
            exit 1
          fi

      - name: Checkout exact deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Guard — refuse wrong SHA / non-main history / non-tip
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          echo "github.event_name=${GITHUB_EVENT_NAME}"
          echo "github.ref=${GITHUB_REF}"
          echo "DEPLOY_SHA=${DEPLOY_SHA}"
          echo "checkout HEAD=$(git rev-parse HEAD)"
          # shellcheck source=scripts/lib/deploy-main-tip-guard.sh
          source scripts/lib/deploy-main-tip-guard.sh
          deploy_guard_main_tip "$DEPLOY_SHA" "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"

      - name: Cancel stale Environment-waiting Deploy Production runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/lib/cancel-stale-waiting-production-deploys.sh

  deploy:
    name: Deploy main commit to production
    needs: gate
    runs-on: ubuntu-latest
    environment: production-deploy
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Pin SHA from gate
        id: resolve
        env:
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
          INPUT_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          case "$DEPLOY_SHA" in
            *[!0-9a-fA-F]*|"")
              echo "Gate did not output a valid SHA" >&2
              exit 1
              ;;
          esac
          if [ "${#DEPLOY_SHA}" -ne 40 ]; then
            echo "Gate SHA must be 40 chars" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "$INPUT_SHA" ]; then
            if [ "$INPUT_SHA" != "$DEPLOY_SHA" ]; then
              echo "Refusing deploy: gate SHA $DEPLOY_SHA != inputs.target_sha $INPUT_SHA" >&2
              exit 1
            fi
          fi
          echo "sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact deploy commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Guard — refuse stale SHA after Environment start (before SSH)
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          echo "github.event_name=${GITHUB_EVENT_NAME}"
          echo "github.ref=${GITHUB_REF}"
          echo "DEPLOY_SHA=${DEPLOY_SHA}"
          echo "checkout HEAD=$(git rev-parse HEAD)"
          # shellcheck source=scripts/lib/deploy-main-tip-guard.sh
          source scripts/lib/deploy-main-tip-guard.sh
          deploy_guard_main_tip "$DEPLOY_SHA" "${GITHUB_EVENT_NAME}" "${GITHUB_REF}"

      - name: Deploy exact commit over SSH
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_SSH_PRIVATE_KEY}" ]; then
            echo "PRODUCTION_SSH_PRIVATE_KEY is empty — configure it on the GitHub Environment 'production-deploy' (not a repository secret, not Environment 'production')." >&2
            exit 1
          fi
          bash scripts/ci-deploy-production.sh --target-sha="${TARGET_SHA}"

      - name: Post-deploy live verification (SHA + NestPOS markers)
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.sha }}
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          LIVE_QA_PASS: ${{ secrets.LIVE_QA_PASS }}
          LIVE_URL: https://taxnest.pk
          LIVE_VERIFY_PROFILE: extended
        run: bash scripts/ci-live-verify.sh

  provenance-status:
    name: Report deployment outcome to approval relay
    if: ${{ always() }}
    needs: [gate, deploy]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: POST outcome callback
        env:
          OWNER_APPROVAL_RELAY_URL: https://taxnest.pk
          APPROVAL_REQUEST_ID: ${{ inputs.approval_request_id }}
          HANDOFF_NONCE: ${{ inputs.handoff_nonce }}
          DEPLOYED_SHA: ${{ needs.gate.outputs.sha }}
          OUTCOME: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=owner-approval-relay" | jq -r .value)"
          jq -n --arg id "$APPROVAL_REQUEST_ID" --arg sha "$DEPLOYED_SHA" \
            --arg outcome "$OUTCOME" --arg url "$RUN_URL" --arg nonce "$HANDOFF_NONCE" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{approval_request_id:$id,handoff_nonce:$nonce,deployed_sha:(if $sha == "" then null else $sha end),outcome:$outcome,run_url:$url,run_id:($run|tonumber),run_attempt:($attempt|tonumber)}' > /tmp/status.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            --data-binary @/tmp/status.json \
            "${OWNER_APPROVAL_RELAY_URL%/}/api/deployment-approval/v1/status"
