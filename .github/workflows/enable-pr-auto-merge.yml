# Enable GitHub native auto-merge (squash) on Cursor Cloud Agent PRs.
#
# Safety:
#   - Does NOT deploy production
#   - Does NOT use Environment "production" or PRODUCTION_SSH_PRIVATE_KEY
#   - Does NOT checkout untrusted PR code (workflow_run on the default branch)
#   - Fork PRs are ignored
#   - Runs only after the "PR checks" workflow succeeds
#   - GitHub still enforces any additional required checks / reviews;
#     this job cannot skip them
#
# GitHub GraphQL enablePullRequestAutoMerge fails with
# "Pull request is in clean status" when mergeable_state is CLEAN
# (nothing left to wait for). In that case squash-merge the same SHA
# that PR checks already validated.
#
# After this file is on main, future PRs whose head branch starts with
# "cursor/" targeting main get squash auto-merge, or an immediate squash
# if GitHub reports CLEAN.
#
# Repo settings: Allow squash merging. Allow auto-merge is still useful
# when required checks are pending. Mark "PR checks / validate" required
# on main so later commits cannot land without a green check.

name: Enable PR auto-merge

on:
  workflow_run:
    workflows: ["PR checks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  enable-auto-merge:
    name: Enable squash auto-merge
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Request squash auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            let candidates = run.pull_requests || [];
            if (candidates.length === 0) {
              const listed = await github.rest.pulls.list({
                owner, repo, state: 'open', base: 'main', per_page: 50,
              });
              candidates = listed.data.filter((p) => p.head.sha === run.head_sha);
            }
            if (candidates.length === 0) {
              core.info('No open PR found for this PR-checks run; nothing to enable.');
              return;
            }

            async function squashMerge(pr) {
              if (pr.head.sha !== run.head_sha) {
                throw new Error(
                  `head SHA ${pr.head.sha} does not match PR-checks SHA ${run.head_sha}`
                );
              }
              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                throw new Error(`not mergeable (state=${pr.mergeable_state})`);
              }
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
                sha: run.head_sha,
              });
              core.info(`PR #${pr.number}: squash-merged (GitHub CLEAN / already mergeable).`);
            }

            let enabled = 0;
            for (const brief of candidates) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: brief.number,
              });
              if (pr.base.ref !== 'main') continue;
              if (pr.draft) continue;
              if (!pr.head.repo || pr.head.repo.full_name !== `${owner}/${repo}`) {
                core.info(`PR #${pr.number}: skip fork`);
                continue;
              }
              if (!pr.head.ref.startsWith('cursor/')) {
                core.info(`PR #${pr.number}: skip non-cursor/ branch ${pr.head.ref}`);
                continue;
              }
              if (pr.merged) {
                core.info(`PR #${pr.number}: already merged.`);
                enabled += 1;
                continue;
              }
              if (pr.head.sha !== run.head_sha) {
                core.info(`PR #${pr.number}: skip stale head (PR ${pr.head.sha} vs checks ${run.head_sha})`);
                continue;
              }
              try {
                if (pr.mergeable_state === 'clean') {
                  await squashMerge(pr);
                  enabled += 1;
                  continue;
                }
                await github.graphql(
                  `mutation($id: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $id,
                      mergeMethod: SQUASH
                    }) {
                      pullRequest { number }
                    }
                  }`,
                  { id: pr.node_id }
                );
                core.info(`PR #${pr.number}: squash auto-merge enabled.`);
                enabled += 1;
              } catch (err) {
                const msg = String(err.message || err);
                if (/already enabled/i.test(msg)) {
                  core.info(`PR #${pr.number}: auto-merge already enabled.`);
                  enabled += 1;
                  continue;
                }
                if (/clean status/i.test(msg) || /already merged/i.test(msg)) {
                  try {
                    const { data: latest } = await github.rest.pulls.get({
                      owner, repo, pull_number: pr.number,
                    });
                    if (latest.merged) {
                      core.info(`PR #${pr.number}: already merged.`);
                      enabled += 1;
                      continue;
                    }
                    await squashMerge(latest);
                    enabled += 1;
                    continue;
                  } catch (mergeErr) {
                    core.setFailed(
                      `PR #${pr.number}: CLEAN auto-merge fallback squash failed: ${mergeErr.message || mergeErr}`
                    );
                    return;
                  }
                }
                core.setFailed(
                  `PR #${pr.number}: could not enable auto-merge: ${msg}. ` +
                  'Confirm Settings → General → Allow auto-merge and Allow squash merging.'
                );
                return;
              }
            }
            if (enabled === 0) {
              core.info('No matching cursor/ same-repo PRs to auto-merge.');
            }
