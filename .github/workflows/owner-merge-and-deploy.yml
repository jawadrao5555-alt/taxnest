# Owner Merge & Deploy — explicit owner initiation only.
#
# Cursor Cloud Agents prepare cursor/* PRs and STOP. They must not merge or
# dispatch this workflow (and typically cannot: workflow_dispatch 403).
#
# Owner approval is issued by the production approval relay. Inputs alone are
# never authorization.
#
# Flow:
#   relay claim (OIDC + approval_request_id + exact repo/PR/HEAD)
#   + cursor/* + not draft + targets main + expected head SHA
#   + PR checks / validate success + mergeable
#   → squash merge pinned to that head SHA
#   → resulting squash SHA MUST equal current origin/main tip
#   → workflow_dispatch Deploy Production with target SHA and correlation nonce
#
# Does NOT:
#   - read production SSH keys or live QA passwords
#   - use a GitHub Environment (no secrets on this job)
#   - expose emergency/manual deployment bypasses
#   - checkout untrusted PR code (checks out the workflow ref = main)
#   - merge non-cursor/, drafts, forks, failed checks, or moved SHAs
#
# Deploy Production stays unattended after this initiation (Environment
# production-deploy, no reviewers). Live Ops stays on Environment production
# with reviewers.

name: Owner Merge & Deploy
run-name: Owner Merge & Deploy — approval ${{ inputs.approval_request_id }}

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: "PR number to squash-merge into main"
        required: true
        type: string
      expected_head_sha:
        description: "Full 40-char PR head SHA that must still match (from the PR)"
        required: true
        type: string
      approval_request_id:
        description: "Single-use approval request ID issued by the production approval relay"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: owner-merge-and-deploy
  cancel-in-progress: false

jobs:
  merge-and-deploy:
    name: Squash merge approved PR and dispatch Deploy Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (workflow ref; not the PR branch)
        uses: actions/checkout@v4

      - name: Owner-approved merge + exact-SHA deploy handoff
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OWNER_APPROVAL_RELAY_URL: https://taxnest.pk
          OWNER_PULL_NUMBER: ${{ inputs.pull_number }}
          OWNER_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          OWNER_APPROVAL_REQUEST_ID: ${{ inputs.approval_request_id }}
        run: |
          bash scripts/owner-merge-and-deploy.sh \
            --pull-number="$OWNER_PULL_NUMBER" \
            --expected-head-sha="$OWNER_EXPECTED_HEAD_SHA" \
            --approval-request-id="$OWNER_APPROVAL_REQUEST_ID"
