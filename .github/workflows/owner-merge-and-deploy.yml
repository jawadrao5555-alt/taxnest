# Owner Merge & Deploy — explicit owner initiation only.
#
# Cursor/Replit Cloud Agents prepare cursor/* or replit/* PRs and STOP. They
# must not merge or dispatch this workflow (and typically cannot:
# workflow_dispatch 403).
#
# Owner approval is issued by the production approval relay. Inputs alone are
# never authorization.
#
# Flow:
#   relay claim (OIDC + approval_request_id + exact jawadrao5555-alt/taxnest
#   repo/PR/HEAD)
#   + cursor/* or replit/* + not draft + targets main + expected head SHA
#   + PR checks / validate success + mergeable
#   → squash merge pinned to that head SHA
#   → resulting squash SHA MUST equal current origin/main tip
#   → workflow_dispatch Deploy Production with target SHA and correlation nonce
#
# Does NOT:
#   - read production SSH keys or live QA passwords
#   - use a GitHub Environment (no secrets on this job)
#   - expose emergency/manual deployment bypasses
#   - checkout untrusted PR code (checks out the workflow ref = main)
#   - merge other branches, drafts, forks, failed checks, or moved SHAs
#
# Deploy Production stays unattended after this initiation (Environment
# production-deploy, no reviewers). Live Ops stays on Environment production
# with reviewers.

name: Owner Merge & Deploy
run-name: Owner Merge & Deploy — approval ${{ inputs.approval_request_id }}

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: "PR number to squash-merge into main"
        required: true
        type: string
      expected_head_sha:
        description: "Full 40-char PR head SHA that must still match (from the PR)"
        required: true
        type: string
      approval_request_id:
        description: "Single-use approval request ID issued by the production approval relay"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: owner-merge-and-deploy
  cancel-in-progress: false

jobs:
  merge-and-deploy:
    name: Squash merge approved PR and dispatch Deploy Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (workflow ref; not the PR branch)
        uses: actions/checkout@v7

      - name: Owner-approved merge + exact-SHA deploy handoff
        id: owner-handoff
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OWNER_APPROVAL_RELAY_URL: https://taxnest.pk
          OWNER_PULL_NUMBER: ${{ inputs.pull_number }}
          OWNER_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          OWNER_APPROVAL_REQUEST_ID: ${{ inputs.approval_request_id }}
        run: |
          bash scripts/owner-merge-and-deploy.sh \
            --pull-number="$OWNER_PULL_NUMBER" \
            --expected-head-sha="$OWNER_EXPECTED_HEAD_SHA" \
            --approval-request-id="$OWNER_APPROVAL_REQUEST_ID"

      - name: Dispatch exact-SHA Agent release when this PR changed the Agent
        if: ${{ steps.owner-handoff.outputs.agent_release_needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.owner-handoff.outputs.merge_sha }}
          APPROVAL_REQUEST_ID: ${{ inputs.approval_request_id }}
        run: |
          set -euo pipefail
          echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          # A transient GitHub API failure must not silently omit the desktop
          # release after the approved merge. Repeated requests remain safe:
          # Build Agent is serialized per SHA and skips an already-published
          # exact-SHA version instead of replacing it.
          for attempt in 1 2 3; do
            if gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-agent.yml/dispatches" \
              -f ref=main \
              -f "inputs[target_sha]=$TARGET_SHA" \
              -f "inputs[approval_request_id]=$APPROVAL_REQUEST_ID"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build Agent dispatch failed after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Dispatched Build PRA Agent for exact merge SHA $TARGET_SHA"

      - name: Release failed owner handoff for a safe retry
        if: ${{ failure() && steps.owner-handoff.outcome == 'failure' }}
        env:
          OWNER_APPROVAL_RELAY_URL: https://taxnest.pk
          APPROVAL_REQUEST_ID: ${{ inputs.approval_request_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TOKEN="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=owner-approval-relay" | jq -r .value)"
          jq -n --arg id "$APPROVAL_REQUEST_ID" --arg url "$RUN_URL" \
            '{approval_request_id:$id,outcome:"failure",failure_summary:("Owner Merge & Deploy failed: " + $url)}' \
            > /tmp/owner-status.json
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            --data-binary @/tmp/owner-status.json \
            "${OWNER_APPROVAL_RELAY_URL%/}/api/deployment-approval/v1/owner-status"
