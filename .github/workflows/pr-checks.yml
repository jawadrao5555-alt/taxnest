# Full disposable PR verification. Does not deploy, use SSH, or read production secrets.
name: PR checks

on:
  pull_request:
    branches: [main, feature/smart-di-import-format-learning]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  workflow-safety:
    name: Workflow and release safety
    runs-on: ubuntu-22.04
    steps:
      - name: Initialize sanitized evidence staging
        run: |
          evidence="$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          mkdir -p "$evidence/logs"
          printf 'lane=%s\nphase=prebootstrap\n' "$GITHUB_JOB" >"$evidence/logs/prebootstrap.log"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install locked JavaScript parser dependency
        run: bash scripts/npm-bootstrap-pinned.sh ci --ignore-scripts --no-audit --no-fund
      - name: Owner-controlled workflow safety checks
        run: |
          bash scripts/tests/pr-auto-merge-check.sh
          bash scripts/tests/issue-to-live-check.sh
          bash scripts/tests/automerge-deploy-handoff-check.sh
          bash scripts/tests/ci-deploy-production-check.sh
          bash scripts/tests/deploy-unattended-safety-check.sh
          bash scripts/tests/owner-merge-and-deploy-check.sh
          bash scripts/tests/live-ops-ssh-hostkey-check.sh
          bash scripts/tests/live-ops-daily-ops-check.sh
          bash scripts/tests/live-ops-autonomous-check.sh
          bash scripts/tests/approval-dispatch-check.sh
          bash scripts/tests/npm-lock-portability-test.sh
          bash scripts/tests/ci-sanitize-evidence-check.sh
          bash scripts/tests/rc-failure-observability-check.sh
      - name: Mandatory PR-check DAG contract
        run: bash scripts/tests/rc-ci-gates-check.sh
      - name: MariaDB container and evidence contract
        run: bash scripts/tests/ci-mariadb-provision-check.sh
      - name: Sanitize CI evidence
        id: sanitize_evidence
        if: always()
        run: |
          bash scripts/ci-sanitize-evidence.sh "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          test -s "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/evidence-metadata.txt"
          test -f "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/SANITIZED_SUCCESS"
      - name: Upload sanitized CI evidence
        if: always() && steps.sanitize_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/taxnest-rc-evidence/${{ github.job }}
          if-no-files-found: warn
          retention-days: 14

  dependency-audit-build:
    name: Locked dependency audit, asset build, and guards
    runs-on: ubuntu-22.04
    steps:
      - name: Initialize sanitized evidence staging
        run: |
          evidence="$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          mkdir -p "$evidence/logs"
          printf 'lane=%s\nphase=prebootstrap\n' "$GITHUB_JOB" >"$evidence/logs/prebootstrap.log"
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Rebuild disposable locked verification lane
        run: bash scripts/rc-recertify.sh --all-locks
      - name: Sanitize CI evidence
        id: sanitize_evidence
        if: always()
        run: |
          bash scripts/ci-sanitize-evidence.sh "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          test -s "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/evidence-metadata.txt"
          test -f "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/SANITIZED_SUCCESS"
      - name: Upload sanitized CI evidence
        if: always() && steps.sanitize_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/taxnest-rc-evidence/${{ github.job }}
          if-no-files-found: warn
          retention-days: 14

  fullphpunit:
    name: Full PHPUnit suite
    runs-on: ubuntu-22.04
    steps:
      - name: Initialize sanitized evidence staging
        run: |
          evidence="$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          mkdir -p "$evidence/logs"
          printf 'lane=%s\nphase=prebootstrap\n' "$GITHUB_JOB" >"$evidence/logs/prebootstrap.log"
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install locked PHP dependencies without application scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-ansi --no-scripts
      - name: Check complete restaurant top-selling list and business dates
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit tests/Feature/PosRestaurantDashboardCountsTest.php
      - name: Check notification read state and product targeting
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit tests/Feature/FeaturedWhatsNewTest.php tests/Feature/WhatsNewAudienceTargetingTest.php
      - name: Check combined FBR identity, exclusive claim and owner recovery
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit tests/Feature/FbrPosIdentityTest.php tests/Feature/FbrPosFiscalReceiptIdentityTest.php tests/Feature/FbrPosReceiptSerialWithFiscalTest.php tests/Feature/FbrPosReceiptOrderMatchLayoutTest.php tests/Feature/FbrPosSubmissionEvidenceTest.php tests/Feature/FbrPosOwnerReconciliationTest.php
      - name: Check Smart DI import safeguards and legacy import regression
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit tests/Unit/CciPilotEvidenceAuditTest.php tests/Unit/CciVoyageInvoiceParserTest.php tests/Unit/InvoiceImportLineClassifierTest.php tests/Feature/InvoiceBulkImportTest.php
      - name: Check optional POS WhatsApp delivery, gates and DI compatibility
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit tests/Feature/PosWhatsappBillShareTest.php tests/Feature/WhatsAppBusinessApiSendTest.php tests/Feature/WhatsAppWebhookSignatureTest.php
      - name: Check Guest House settings regressions before the full suite
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit tests/Feature/HotelSettingsCategoryTest.php
      - name: Check occupied waiter table regressions before the full suite
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit tests/Feature/PosCounterOrderOpenStatusesTest.php tests/Feature/PosWaiterOrderSettleAuthTest.php tests/Feature/WaiterCashierEditBehaviorTest.php
      - name: Check Hotel bill dialog and fiscal cancellation regressions before the full suite
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit tests/Feature/HotelGuestHouseV1Test.php tests/Feature/HotelCategoryNativeUiTest.php tests/Feature/HotelSimpleDeskPricingTest.php tests/Feature/HotelCreditNotePolicyTest.php tests/Feature/HotelGuestHouseFinalDeliveryTest.php
      - name: Check Caller ID recovery, timestamp, package and legacy regressions
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit tests/Feature/PosCallerRingUuidTest.php tests/Feature/PosCallerRingCollapseTest.php tests/Feature/PosCallerEventsEtagTest.php tests/Feature/PosCallerIdPlanGateTest.php tests/Feature/PosCallerIdToggleAndEventsTest.php tests/Feature/AgentCallerReplayTest.php
      - name: Run full suite in clean loopback-only environment
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit
      - name: Sanitize CI evidence
        id: sanitize_evidence
        if: always()
        run: |
          bash scripts/ci-sanitize-evidence.sh "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          test -s "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/evidence-metadata.txt"
          test -f "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/SANITIZED_SUCCESS"
      - name: Upload sanitized CI evidence
        if: always() && steps.sanitize_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/taxnest-rc-evidence/${{ github.job }}
          if-no-files-found: warn
          retention-days: 14

  native-mariadb-di:
    name: Native MariaDB migration, concurrency, and DI
    runs-on: ubuntu-22.04
    container:
      image: mariadb:10.6.23-jammy@sha256:93435df079cf42c7590ad12f7481d88d297d0228c723c152eb0600caa25a157f
      options: --user root
    env:
      RC_MARIADB_VERSION: '10.6.23'
    steps:
      - name: Bootstrap pinned MariaDB container before checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          mkdir -p "$evidence/logs" "$GITHUB_WORKSPACE"
          exec > >(tee "$evidence/logs/prebootstrap.log") 2>&1
          printf 'lane=%s\nphase=prebootstrap\n' "$GITHUB_JOB"
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          apt-get update
          apt-get install -y --no-install-recommends bash ca-certificates git sudo
      - uses: actions/checkout@v7
        with:
          set-safe-directory: false
      - name: Install isolated MariaDB-container build prerequisites
        run: bash scripts/ci-mariadb-provision.sh install
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer
      - name: Verify PHP and pinned MariaDB toolchain
        run: bash scripts/ci-mariadb-provision.sh verify
      - name: Install MariaDB 10.6 and locked PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-ansi --no-scripts
      - name: Run disposable data-bearing migration and DI proof
        env:
          RC_MARIADB_PORT: '33116'
        run: bash scripts/rc-safe-run -- bash scripts/rc-mariadb-migration-lab.sh --all
      - name: Run required MariaDB-only supplemental probes
        env:
          RC_MARIADB_PORT: '33116'
        run: bash scripts/rc-mariadb-supplemental.sh
      - name: Sanitize CI evidence
        id: sanitize_evidence
        if: always()
        run: |
          bash scripts/ci-sanitize-evidence.sh "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          test -s "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/evidence-metadata.txt"
          test -f "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/SANITIZED_SUCCESS"
      - name: Upload sanitized CI evidence
        if: always() && steps.sanitize_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/taxnest-rc-evidence/${{ github.job }}
          if-no-files-found: warn
          retention-days: 14

  browserdesktopmobile:
    name: Browser acceptance at desktop and 390px mobile
    runs-on: ubuntu-22.04
    container:
      image: mariadb:10.6.23-jammy@sha256:93435df079cf42c7590ad12f7481d88d297d0228c723c152eb0600caa25a157f
      options: --user root
    env:
      RC_MARIADB_VERSION: '10.6.23'
    steps:
      - name: Bootstrap pinned MariaDB container before checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          mkdir -p "$evidence/logs" "$GITHUB_WORKSPACE"
          exec > >(tee "$evidence/logs/prebootstrap.log") 2>&1
          printf 'lane=%s\nphase=prebootstrap\n' "$GITHUB_JOB"
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          apt-get update
          apt-get install -y --no-install-recommends bash ca-certificates git sudo
      - uses: actions/checkout@v7
        with:
          set-safe-directory: false
      - name: Install isolated MariaDB-container build prerequisites
        run: bash scripts/ci-mariadb-provision.sh install
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Verify PHP, Node 22, and pinned MariaDB toolchain
        env:
          RC_REQUIRE_NODE: '1'
        run: bash scripts/ci-mariadb-provision.sh verify
      - name: Install disposable browser and local database prerequisites
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-ansi --no-scripts
          bash scripts/npm-bootstrap-pinned.sh ci --ignore-scripts --no-audit --no-fund
          RC_BROWSER_STATE_ROOT=/tmp/taxnest-rc-browser-${{ github.run_id }}-${{ github.job }} \
            bash scripts/rc-playwright-install.sh
          node scripts/tests/local-browser-discovery-check.mjs
      - name: Seed and verify authenticated Smart DI source import
        id: browser-preflight
        env:
          RC_MARIADB_PORT: '33117'
          RC_BROWSER_PORT: '5911'
          RC_BROWSER_STATE_ROOT: /tmp/taxnest-rc-browser-${{ github.run_id }}-${{ github.job }}
        run: |
          bash scripts/rc-browser-fixture.sh setup
          RC_TUTORIAL_RECORDING=1 RC_BROWSER_ONLY=restaurant-top-selling bash scripts/rc-browser-fixture.sh run
          RC_BROWSER_ONLY=notification-pra,notification-fbr,notification-di bash scripts/rc-browser-fixture.sh run
          RC_BROWSER_ONLY=agent-build-identity bash scripts/rc-browser-fixture.sh run
          RC_BROWSER_ONLY=admin-dashboard-details bash scripts/rc-browser-fixture.sh run
          RC_BROWSER_ONLY=readonly-reporting-connection bash scripts/rc-browser-fixture.sh run
          RC_BROWSER_ONLY=admin-company-directory-contrast bash scripts/rc-browser-fixture.sh run
          RC_BROWSER_ONLY=whatsapp-optional-autosend bash scripts/rc-browser-fixture.sh run
          RC_BROWSER_ONLY=rider-realtime-map bash scripts/rc-browser-fixture.sh run
          RC_BROWSER_ONLY=companyAdminSmartImport bash scripts/rc-browser-fixture.sh run
          test -s "$RC_BROWSER_STATE_ROOT/safe-runtime/browser-state/tutorial-videos/recording-manifest.json"
          mkdir -p "$RUNNER_TEMP/tutorial-preview"
          cp "$RC_BROWSER_STATE_ROOT/safe-runtime/browser-state/tutorial-videos/"*.webm "$RUNNER_TEMP/tutorial-preview/"
          cp "$RC_BROWSER_STATE_ROOT/safe-runtime/browser-state/tutorial-videos/recording-manifest.json" "$RUNNER_TEMP/tutorial-preview/"
          echo "preview_dir=$(realpath "$RUNNER_TEMP/tutorial-preview")" >> "$GITHUB_OUTPUT"
      - name: Exercise general isolated browser acceptance
        env:
          RC_MARIADB_PORT: '33117'
          RC_BROWSER_PORT: '5911'
          RC_BROWSER_STATE_ROOT: /tmp/taxnest-rc-browser-${{ github.run_id }}-${{ github.job }}
        run: |
          trap 'bash scripts/rc-browser-fixture.sh stop' EXIT
          bash scripts/rc-browser-fixture.sh run
      - name: Stop disposable browser fixture
        if: always()
        env:
          RC_MARIADB_PORT: '33117'
          RC_BROWSER_PORT: '5911'
          RC_BROWSER_STATE_ROOT: /tmp/taxnest-rc-browser-${{ github.run_id }}-${{ github.job }}
        run: bash scripts/rc-browser-fixture.sh stop
      - name: Sanitize CI evidence
        id: sanitize_evidence
        if: always()
        run: |
          bash scripts/ci-sanitize-evidence.sh "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          test -s "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/evidence-metadata.txt"
          test -f "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/SANITIZED_SUCCESS"
      - name: Upload sanitized CI evidence
        if: always() && steps.sanitize_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/taxnest-rc-evidence/${{ github.job }}
          if-no-files-found: warn
          retention-days: 14
      - name: Upload synthetic Top Selling recording preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-preview-${{ github.run_id }}
          path: |
            ${{ steps.browser-preflight.outputs.preview_dir }}/*.webm
            ${{ steps.browser-preflight.outputs.preview_dir }}/recording-manifest.json
          if-no-files-found: error
          retention-days: 14

  jsagentrealtime:
    name: Node 22 PRA Agent and realtime gateway
    runs-on: ubuntu-22.04
    steps:
      - name: Initialize sanitized evidence staging
        run: |
          evidence="$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          mkdir -p "$evidence/logs"
          printf 'lane=%s\nphase=prebootstrap\n' "$GITHUB_JOB" >"$evidence/logs/prebootstrap.log"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install locked platform-independent test dependencies
        run: |
          bash scripts/npm-bootstrap-pinned.sh ci --ignore-scripts --no-audit --no-fund
          (cd pra-agent && bash ../scripts/npm-bootstrap-pinned.sh ci --ignore-scripts --no-audit --no-fund)
          (cd agent-realtime-gateway && bash ../scripts/npm-bootstrap-pinned.sh ci --ignore-scripts --no-audit --no-fund)
      - name: Run PRA Agent JavaScript tests with egress blocked
        run: |
          mapfile -t tests < <(find pra-agent/test -maxdepth 1 -type f -name '*.test.js' ! -name 'local-core-internet-cut.test.js' -printf '%p\n' | sort)
          bash scripts/rc-safe-run -- node --test --test-concurrency=1 "${tests[@]}"
          bash scripts/rc-safe-run -- node --test scripts/tests/notification-acknowledgement.test.mjs scripts/tests/notification-bell-unread.test.mjs
          bash scripts/rc-safe-run -- node --test scripts/tests/hotel-settings-save.test.mjs scripts/tests/hotel-receipt-review.test.mjs scripts/tests/hotel-desk-preview.test.mjs scripts/tests/print-extension-bridge.test.mjs
      - name: Check isolated tutorial recording paths
        run: bash scripts/rc-safe-run -- node --test scripts/tests/tutorial-recording.test.mjs
      - name: Check Android beta artifact inventory
        run: bash scripts/rc-safe-run -- node --test scripts/tests/android-beta-manifest.test.mjs
      - name: Check realtime rider map request ordering and recovery
        run: bash scripts/rc-safe-run -- node --test scripts/tests/rider-realtime-map.test.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Rider app and run real JSON batch policy tests
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          gradle -p rider-app --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Check complete catalog search and exact scanner priority
        run: bash scripts/rc-safe-run -- node --test scripts/tests/catalog-search-results.test.mjs
      - name: Check delivery address race and snapshot preservation
        run: bash scripts/rc-safe-run -- node --test scripts/tests/delivery-address-state.test.mjs scripts/tests/delivery-phone-search.test.mjs
      - name: Run realtime gateway tests with egress blocked
        run: bash scripts/rc-safe-run -- node --test --test-concurrency=1 agent-realtime-gateway/test/gateway.test.js agent-realtime-gateway/test/wake-secret.test.js
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check durable Caller ID recovery without external services
        run: bash scripts/rc-safe-run -- java scripts/tests/CallerOutboxCheck.java .
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Compile all Caller ID flavors and run Android unit tests
        run: |
          sdkmanager "platforms;android-36" "build-tools;34.0.0"
          gradle -p caller-app --no-daemon --console=plain :app:testSimDebugUnitTest :app:testPlusDebugUnitTest :app:testPlayDebugUnitTest :app:assembleSimDebug :app:assemblePlusDebug :app:assemblePlayDebug
      - name: Sanitize CI evidence
        id: sanitize_evidence
        if: always()
        run: |
          bash scripts/ci-sanitize-evidence.sh "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          test -s "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/evidence-metadata.txt"
          test -f "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/SANITIZED_SUCCESS"
      - name: Upload sanitized CI evidence
        if: always() && steps.sanitize_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/taxnest-rc-evidence/${{ github.job }}
          if-no-files-found: warn
          retention-days: 14

  manifest-provenance:
    name: Exact-SHA manifest and release-chain proof
    runs-on: ubuntu-22.04
    steps:
      - name: Initialize sanitized evidence staging
        run: |
          evidence="$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          mkdir -p "$evidence/logs"
          printf 'lane=%s\nphase=prebootstrap\n' "$GITHUB_JOB" >"$evidence/logs/prebootstrap.log"
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install locked PHP dependencies without application scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-ansi --no-scripts
      - name: Verify owner-controlled exact-SHA release chain
        run: bash scripts/rc-safe-run -- bash scripts/tests/agent-release-chain-check.sh
      - name: Verify canonical manifest server-side rejection rules
        run: bash scripts/rc-safe-run -- vendor/bin/phpunit tests/Unit/AgentReleaseManifestTest.php
      - name: Sanitize CI evidence
        id: sanitize_evidence
        if: always()
        run: |
          bash scripts/ci-sanitize-evidence.sh "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB"
          test -s "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/evidence-metadata.txt"
          test -f "$RUNNER_TEMP/taxnest-rc-evidence/$GITHUB_JOB/SANITIZED_SUCCESS"
      - name: Upload sanitized CI evidence
        if: always() && steps.sanitize_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ github.job }}-${{ github.run_id }}
          path: ${{ runner.temp }}/taxnest-rc-evidence/${{ github.job }}
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: validate
    if: always()
    needs:
      - workflow-safety
      - dependency-audit-build
      - fullphpunit
      - native-mariadb-di
      - browserdesktopmobile
      - jsagentrealtime
      - manifest-provenance
    runs-on: ubuntu-22.04
    steps:
      - name: Require every mandatory verification lane to pass
        run: |
          test "${{ needs.workflow-safety.result }}" = success
          test "${{ needs.dependency-audit-build.result }}" = success
          test "${{ needs.fullphpunit.result }}" = success
          test "${{ needs.native-mariadb-di.result }}" = success
          test "${{ needs.browserdesktopmobile.result }}" = success
          test "${{ needs.jsagentrealtime.result }}" = success
          test "${{ needs.manifest-provenance.result }}" = success

