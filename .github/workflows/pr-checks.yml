# Lightweight PR checks. Does not deploy, SSH, or read production secrets.
# Mark this workflow as a required status check on main.
#
# types must be explicit: GitHub's pull_request default is only
# opened / synchronize / reopened. ready_for_review is NOT default, so a
# draft that becomes Ready after checks already passed never re-runs this
# workflow. Keep the default three AND ready_for_review so the owner sees
# fresh checks before Owner Merge & Deploy.
# Do not add a pull_request trigger to owner-merge-and-deploy.yml
# (that would run the write-token job from the PR branch).

name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workflow and auto-merge safety checks
        run: bash scripts/tests/pr-auto-merge-check.sh
      - name: Issue-to-live workflow safety checks
        run: bash scripts/tests/issue-to-live-check.sh
      - name: Auto-merge disabled / owner-handoff checks
        run: bash scripts/tests/automerge-deploy-handoff-check.sh
      - name: Production deploy workflow safety checks
        run: bash scripts/tests/ci-deploy-production-check.sh
      - name: Unattended Deploy Production safety checks
        run: bash scripts/tests/deploy-unattended-safety-check.sh
      - name: Owner Merge & Deploy safety checks
        run: bash scripts/tests/owner-merge-and-deploy-check.sh
      - name: Live Ops SSH host-key pin checks
        run: bash scripts/tests/live-ops-ssh-hostkey-check.sh
      - name: Live Ops daily-ops allow-list checks
        run: bash scripts/tests/live-ops-daily-ops-check.sh
      - name: Live Ops autonomous owner-command checks
        run: bash scripts/tests/live-ops-autonomous-check.sh
