# Install into Apache's conf.d directory. This is intentionally the sole public
# route to the loopback gateway: /health and /internal/wake stay loopback-only.
SSLProxyEngine On
ProxyRequests Off
# The gateway pings every 30 seconds and drops stale clients after 75 seconds.
# Keep Apache comfortably above both values so an otherwise healthy idle tunnel
# is not recycled before its first keepalive.
ProxyPassMatch "^/agent-realtime$" "ws://127.0.0.1:6101/agent-realtime" retry=0 timeout=120