plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI signing: keystore path/password come from env — SAME keystore as the
// rider/pos apps (repo is PUBLIC, never commit a keystore here).
def ciKeystore = System.getenv("RIDER_KS")
def ciKeystorePass = System.getenv("RIDER_KS_PASS")

android {
    namespace 'pk.taxnest.callerid'
    // compileSdk 36 = Android 16. Play ki 31 Aug 2026 wali shart sirf PLAY
    // build par lagti hai (neeche play flavor ka targetSdk); website builds
    // targetSdk 34 par hi hain, is liye un ka runtime behaviour zarra barabar
    // nahi badla — Android ki behaviour changes targetSdk se chalti hain,
    // compileSdk se nahi.
    compileSdk 36

    defaultConfig {
        applicationId "pk.taxnest.callerid"
        // Android 8+ — matches the downloads-page "Android 8+".
        minSdk 26
        targetSdk 34
        // Website builds ka self-update isi number se chalta hai — bump ke baad
        // SystemSetting `caller_app_latest_version` (+ `caller_app_plus_latest_version`)
        // bhi wohi versionName karna zaroori hai, warna signed-in phone khud
        // update nahi hoga. RELEASE.md dekhein.
        //   1.3.0 = teen zubaanon ka switch (Task 1382)
        //   1.4.0 = POS se call back (Task 1381)
        //   1.5.0 = plus build par number ki wapsi: SIM ka number ab telephony
        //           se (notification se sirf naam milta tha jab number contact
        //           mein save ho), aur WhatsApp ke naam ka number phone ki
        //           contact list se — dekhein "Plus build ka number" RELEASE.md
        //   1.6.0 = bahar jane wali call par popup band. Dialer ki notification
        //           nahi batati ke call aa rahi hai ya ja rahi hai (call milne
        //           ke baad sirf naam + timer bachta hai), is liye telephony se
        //           faisla: bina RINGING ke OFFHOOK = hum ne khud milai hai.
        versionCode 7
        versionName "1.6.0"
    }

    // ── Builds (Task 1345 + 1346) — ek hi package id, ek hi keystore ────────
    //  sim  = website ka "clean" download (default). Sirf SIM/dialer ki incoming
    //         call, Android telephony se. Play Protect ki blocked chaar
    //         permissions (RECEIVE_SMS, READ_SMS, notification-listener,
    //         accessibility) mein se koi nahi → website se install block nahi.
    //  plus = website ki SIM + WhatsApp build (NotificationListenerService).
    //         Install ke liye shop ko Play Protect waqti tor par band karna
    //         parta hai.
    //  play = Google Play ke liye (Task 1346). Detection plus jaisi hi (SIM +
    //         WhatsApp) — Play Store se aane wali app par Play Protect ka
    //         sideload-block hota hi nahi. Farq sirf yeh:
    //           • self-update ka poora hissa gair-mojood (src/web/java compile
    //             hi nahi hota) aur REQUEST_INSTALL_PACKAGES manifest se hataai
    //             gayi — Play self-update ko mana karta hai
    //           • targetSdk 36 (Play ki 31 Aug 2026 wali shart)
    //         Yeh build kabhi website par host NAHI hoti.
    //
    // applicationId teenon mein same hai (pk.taxnest.callerid) taake website
    // ki ek build doosri par seedhi update ho jaye. Play wali copy Google ke
    // app-signing key se sign hoti hai — website APK aur Play install ke beech
    // aana-jaana kaise chalta hai, caller-app/RELEASE.md mein likha hai.
    flavorDimensions += "detect"
    productFlavors {
        // create("...") ZAROORI hai: Groovy ke Object.plus() ki wajah se
        // `plus { ... }` flavor banata hi NAHI (build "Task
        // 'assemblePlusRelease' not found" par girti hai). Teenon flavors ek
        // hi tareeqe se banayein taake yeh trap dobara na lage.
        create("sim") {
            dimension "detect"
            buildConfigField "String", "BUILD_KIND", '"sim"'
        }
        create("plus") {
            dimension "detect"
            buildConfigField "String", "BUILD_KIND", '"plus"'
        }
        create("play") {
            dimension "detect"
            buildConfigField "String", "BUILD_KIND", '"play"'
            // Play Console: 31 Aug 2026 se nai app ke liye Android 16 lazmi.
            targetSdk = 36
        }
    }

    // Kaunsa code kis build mein jata hai (ek jagah, taake logic fork na ho):
    //   src/web/java   → self-update (UpdateCheck + Updater) AUR call back ka
    //                    tap-to-dial (Task 1381: CallerApp, DialWatchService,
    //                    DialActivity, DialBootReceiver). SIRF website builds.
    //                    Play flavor ka apna no-op Updater hai aur call back
    //                    us mein bilkul nahi jata.
    //   src/web/res    → sirf Task 1381 ki dial strings (web/java ke saath).
    //   src/notif/*    → notification-listener detector + prominent disclosure.
    //                    plus AUR play, bilkul ek jaisa.
    //   src/telephony/ → PhoneStateReceiver (Android telephony se SIM ki ring).
    //                    sim AUR plus dono website builds mein. Play mein KABHI
    //                    nahi: READ_PHONE_STATE/READ_CALL_LOG Play ka Call Log
    //                    declaration form lazmi kar dete hain, aur
    //                    scripts/play-build-check.sh is class ko AAB mein
    //                    dekhte hi build fail kar deta hai. Yeh folder is liye
    //                    src/sim se nikaal kar alag kiya gaya ke plus ise bhi
    //                    compile kare — poora src/sim/java plus mein daalna
    //                    mumkin nahi tha (Detector.kt dono jagah hai →
    //                    "Redeclaration").
    // Ek source set ke do res folders mein ek hi key dobara likhna "Duplicate
    // resources" error deta hai — is liye har build ki apni key uski apni
    // res/values/strings.xml mein rehti hai (misal `build_badge`: src/plus/res
    // aur src/play/res mein, src/notif/res mein NAHI).
    //
    // Task 1382 — teen zubaanein: har res folder ke teen variants hain
    //   values/  (English, default) · values-b+ur+Latn/ (Roman Urdu) · values-ur/ (Urdu)
    // Override HAR variant ke liye alag likhna parta hai: sirf values/ override
    // karne se Urdu/Roman mode mein src/main wali line reh jati hai.
    sourceSets {
        getByName("sim") {
            java.srcDirs += ['src/web/java', 'src/telephony/java']
            res.srcDirs += 'src/web/res'
        }
        getByName("plus") {
            java.srcDirs += ['src/web/java', 'src/notif/java', 'src/telephony/java']
            res.srcDirs += ['src/notif/res', 'src/web/res']
        }
        getByName("play") {
            java.srcDirs += 'src/notif/java'
            res.srcDirs += 'src/notif/res'
        }
        // CallSourceRules ke JVM unit tests — plain JUnit, koi emulator nahi.
        // Rules dono notification builds mein ek hi hain, is liye ek hi test
        // folder dono flavors ke test source set mein jata hai:
        //   gradle testPlusReleaseUnitTest testPlayReleaseUnitTest
        getByName("testPlus") {
            // src/plusTest = sirf plus wale hisse ke tests (ContactNumberLookup) —
            // play mein us class ka no-op version hai, is liye ye tests uske
            // test source set mein NAHI ja sakte.
            java.srcDirs += ['src/notifTest/java', 'src/plusTest/java']
        }
        getByName("testPlay") {
            java.srcDirs += 'src/notifTest/java'
        }
    }

    signingConfigs {
        ciRelease {
            if (ciKeystore != null) {
                storeFile file(ciKeystore)
                storePassword ciKeystorePass
                keyAlias "rider"
                keyPassword ciKeystorePass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ciKeystore != null) {
                signingConfig signingConfigs.ciRelease
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// ── Teen zubaanon ka guard (Task 1388) ──────────────────────────────────────
// Lint ka `MissingTranslation` sirf tab bolta hai jab key kisi locale file
// mein hai hi NAHI. Jo surat asal mein pesh aati hai — flavor apni values/
// mein override kare aur values-ur/ (ya values-b+ur+Latn/) mein na kare — us
// par lint bilkul khamosh hai, kyunki src/main par gir jana qanooni resource
// resolution hai. Nateeja: English mein sahi, aur shop ke Urdu par switch
// karte hi clean build wali line. Wohi bug jo Task 1382 ne khatam kiya tha.
//
// scripts/caller-lang-check.sh source tree par yehi cheez pakadta hai (SDK ya
// APK ki zaroorat nahi). Yahan preBuild se bandha hai, is liye har
// `gradle -p caller-app ...` build khud hi chala leti hai; alag se bhi chal
// sakta hai — caller-app/RELEASE.md dekhein.
def langCheckScript = file("${rootDir}/../scripts/caller-lang-check.sh")
def checkStringLanguages = tasks.register("checkStringLanguages", Exec) {
    group = "verification"
    description = "Har translatable string values/, values-b+ur+Latn/ aur values-ur/ — " +
            "teenon mein, aur aik hi source set se (Task 1388)."
    workingDir = langCheckScript.parentFile.parentFile   // repo root
    commandLine 'bash', langCheckScript.absolutePath
    doFirst {
        if (!langCheckScript.exists()) {
            throw new GradleException(
                    "scripts/caller-lang-check.sh nahi mila — caller-app taxnest repo ke " +
                    "andar se build hoti hai (caller-app/RELEASE.md).")
        }
    }
}
tasks.named("preBuild").configure { dependsOn(checkStringLanguages) }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
}
