plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI signing: keystore path/password come from env — SAME keystore as the
// rider/pos apps (repo is PUBLIC, never commit a keystore here).
def ciKeystore = System.getenv("RIDER_KS")
def ciKeystorePass = System.getenv("RIDER_KS_PASS")

android {
    namespace 'pk.taxnest.callerid'
    compileSdk 34

    defaultConfig {
        applicationId "pk.taxnest.callerid"
        // Android 8+ — matches the downloads-page "Android 8+".
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    // ── Task 1345: DO builds, ek hi package id + ek hi keystore ─────────────
    //  sim  = "clean" download (default). Sirf SIM/dialer ki incoming call,
    //         Android telephony se. Play Protect ki blocked chaar permissions
    //         (RECEIVE_SMS, READ_SMS, notification-listener, accessibility)
    //         mein se koi nahi → website se install block nahi hoti.
    //  plus = pehle wali build: SIM + WhatsApp (NotificationListenerService).
    //         Install ke liye shop ko Play Protect waqti tor par band karna
    //         parta hai.
    //
    // applicationId dono mein same hai (pk.taxnest.callerid) taake ek build
    // doosri par seedhi update ho jaye — sign bhi ek hi rider keystore se.
    // Server par version check alag hai (`/version?build=sim|plus`) warna plus
    // wale phone ko clean build ka update chala jata aur WhatsApp detection
    // chupke se khatam ho jati.
    flavorDimensions += "detect"
    productFlavors {
        // create("...") ZAROORI hai: Groovy ke Object.plus() ki wajah se
        // `plus { ... }` flavor banata hi NAHI (build "Task
        // 'assemblePlusRelease' not found" par girti hai). Dono flavors ek
        // hi tareeqe se banayein taake yeh trap dobara na lage.
        create("sim") {
            dimension "detect"
            buildConfigField "String", "BUILD_KIND", '"sim"'
        }
        create("plus") {
            dimension "detect"
            buildConfigField "String", "BUILD_KIND", '"plus"'
        }
    }

    signingConfigs {
        ciRelease {
            if (ciKeystore != null) {
                storeFile file(ciKeystore)
                storePassword ciKeystorePass
                keyAlias "rider"
                keyPassword ciKeystorePass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ciKeystore != null) {
                signingConfig signingConfigs.ciRelease
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
