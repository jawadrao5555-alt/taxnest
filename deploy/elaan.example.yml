# Copy to deploy/elaan.yml in a production-bound PR. GitHub Actions publishes
# this as "{title} [deploy {TARGET_SHA}]" so each new SHA gets its own
# AppUpdate row. Same-SHA retries no-op that qualified title (no duplicate,
# no re-date). Do not reuse Daily L001. skip_elaan is emergency-only.
#
# GitHub Actions (after Environment approval + SSH) inserts this as a
# published AppUpdate via scripts/elaan-insert.sh, then runs the existing
# Elaan freshness gate. Cursor Cloud Agents must never write this to live
# themselves.
#
# Omit deploy/elaan.yml for emergency/infra deploys that use skip_elaan,
# or when an announcement was already inserted on live after the last marker.

title: "Naya update — YYYY-MM-DD unique title"
audience: pos
# audience: pos | fbr_pos | all
# Freshness gate counts pos and all only. fbr_pos-only will not pass the gate.
type: improvement
# type: feature | improvement
points:
  - "Pehla change POS user ko Roman Urdu / English mein."
  - "Doosra point."
# category: restaurant
# categories:
#   - restaurant
#   - pharmacy
