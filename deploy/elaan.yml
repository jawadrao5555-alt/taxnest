# Elaan for THIS production deploy only. CI publishes
#   "{title} [deploy {TARGET_SHA}]"
# so a new SHA cannot no-op against an older AppUpdate with the same human
# title (Deploy Production #15). Same-SHA retries stay idempotent.
# Do not reuse Daily L001. Do not use skip_elaan except emergencies.

title: "Production update — NestPOS receipt printing reliability"
audience: all
type: feature
points:
  - "Receipt aur KOT printing ka retry flow ab ek hi print-attempt ko safely track karta hai."
  - "Lost, malformed ya ambiguous response par automatic retry same attempt use karta hai, is liye duplicate receipt ka risk kam hota hai."
  - "Manual reprint hamesha naya attempt banata hai, jabke offline fallback known offline state mein available rehta hai."
