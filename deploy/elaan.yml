title: "PRA scheduled offers, frozen cost aur mukammal history milaan"
audience: pos
type: improvement
points:
  - "Order cancel karte waqt wajah aur tayyar quantity record karein; khali quantity unknown rahegi."
  - "Deliveries se selected unassigned final cash bills ki shop receipt banayein; cash receive karna delivery complete karne se alag hai."
  - "Stock-In mein compatible ingredient units aur rate convert hote hain; posting se pehle conversion preview check karein."
  - "Recipe reports mein waste samait cost aur available servings dikhte hain; returns asal sale ki ingredient quantity aur cost istemal karte hain."
  - "Taxable aur exempt items wali deal ka tax alag hisab se lagta hai; return aur purane bill ki cost asal sale ke mutabiq rehti hai."
  - "Reports mein business-day milaan aur CSV se final gross, returns aur net dekhein; purani missing detail zero sales nahin dikhai jati. Souday ki provisional raqam alag hai."
  - "Product/size report mein standalone aur deal-component raqam alag hai; stock health mein khali stock dobara count nahin hota aur valuation ki bunyaad wazeh hai."
  - "Deals page se waqt ke mutabiq all ya selected product offers set karein. Offer aur manual discount jama nahin hote; expired cart mein Offers refresh karein aur total dobara dekhein."
  - "Offer ki payment online hoti hai. Receipt, partial return aur purani history mein asal offer aur sale-time cost mehfooz rehti hai."
