title: "Caller history ab upar ke menu ke neeche saaf nazar aaye"
audience: pos
type: improvement
points:
  - "Caller ID ki recent calls wali list upar ke menu ke peechhe nahi chhupti; pichhli call se Bill ka button aasani se milta hai."
  - "Chhoti screen par list ke andar scroll kar sakte hain. Payment ya zaroori confirmation khuli ho to caller panel beech mein nahi aata."
