title: "Agent mein thermal slip ki lambai ka naya option"
audience: pos
type: improvement
points:
  - "Naya Agent install karne ke baad Configuration mein 'Lambi khali slip? Printer paper mode' kholein."
  - "Jis thermal printer par lamba khali paper nikalta ho, uske asal roll ke mutabiq 58mm ya 80mm chunein aur Save & Connect dabayein."
  - "Ek test slip par text aur lambai check karein. Pehle se chalti Windows paper setting tab tak wahi rahegi jab tak aap naya option na chunein."
