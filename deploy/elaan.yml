title: "School aur Hospital mein wohi FBR Settings"
audience: fbr_pos
type: improvement
points:
  - "School aur Hospital ki Settings mein FBR Integration Settings kholein. Yahan baqi FBR POS categories wala poora setup milega."
  - "FBR ON/OFF, Submission Mode, POS configuration, Test Connection aur Desktop Agent ki settings aik hi jagah hain."
  - "Pehle se saved settings mehfooz hain. Purani receipts apne asal submission mode aur POS ID ke sath rahengi."
