title: "Local IMS setup — shop PC aur connection ki asaan pehchan"
audience: pos
type: improvement
points:
  - "Updated Desktop Agent 1.13.31 ke saath Tax Integrations mein connected shop PC aur detected local IMS service select karein. UID aur URL manually dhoondne ki zaroorat kam ho gayi hai."
  - "Compatible SOAP IMS ki support shamil hai. PRA ka pehle se saved setup apni jagah rehta hai; local detection se FBR registration ya environment ki tasdeeq nahi hoti."
  - "Agent mein installation folder aur Windows installed apps ke buttons hain. Failed start ke baad Open POS se dobara connection ki koshish kar sakte hain."
