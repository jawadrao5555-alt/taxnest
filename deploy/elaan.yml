title: "Agent mein printer ke paper size ka istemal"
audience: pos
type: improvement
points:
  - "Naya Desktop Agent bina popup print ke liye chune hue printer ka Windows mein saved paper size istemal karta hai."
  - "Yeh tabdeeli Agent update install hone par lagu hogi. Windows mein paper size apne printer ke roll ke mutabiq rakhein."
  - "Update ke baad Printer Settings se ek test slip nikaal kar text aur poori width check karein."
