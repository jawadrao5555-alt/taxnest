title: "Naye caller ka delivery bill asani se banayein"
audience: pos
type: improvement
points:
  - "Caller ID mein naye number par Bill dabane se Delivery select ho jayegi, agar aapki dukan mein Delivery chalu hai."
  - "Sirf call aane se bill ki qisam nahi badlegi. Cart mein mojood cheezein bhi barqarar rahengi."
