title: "Wapas kholay gaye order ki nayi cheezon ka jaiza"
audience: pos
type: improvement
points:
  - "Purana order khol kar cheezein barhane ke baad payment se pehle yaad-dihani nazar aayegi."
  - "Cancel kar ke cart ka jaiza lein ya pehle kitchen ko bhejein. Tasdeeq karne par nayi cheezein bhi bill mein shamil rahengi."
