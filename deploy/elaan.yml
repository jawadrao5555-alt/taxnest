title: "Bill ke lafzon ka font aur size apni pasand se rakhein"
audience: pos
type: improvement
points:
  - "Receipt Settings mein font, cheezon ke lafzon ka size aur naam ke liye zyada jagah chun sakte hain."
  - "Nayi choice save karne tak aapke mojooda bills ki shakal nahi badlegi. Cheezon ke poore naam aur amounts barqarar rahengi."
