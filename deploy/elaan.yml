title: "FBR POS invoice serial allocation ab durable hai"
audience: all
type: improvement
points:
  - "FBR POS company-wise invoice serial high-water record rakhta hai taa-ke puranay ya deleted bills ka number dobara allocate na ho."
  - "Mojooda invoice references aur fiscal numbers preserve hain; har company ki series alag rehti hai."
  - "Historical duplicate references milnay par migration review mangti hai; records khud delete ya renumber nahi hotay."
