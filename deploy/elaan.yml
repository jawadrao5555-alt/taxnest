title: "PRA ke sath FBR POS setup mein PCT code ki asani"
audience: pos
type: improvement
points:
  - "PRA ke sath FBR POS ki automatic reporting setup mein catalogue ka PCT code optional hai. Maujood code diya ho to wohi istemal hota hai."
  - "Digital Invoice ke liye HS code ab bhi zaroori hai. FBR POS ki reporting se pehle tax rate aur selected environment review karein."
  - "Automatic reporting aap ke save kiye hue faislay ke mutabiq hi chalay gi. Is update se reporting khud ON nahi hoti."
