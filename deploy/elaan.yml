title: "Package ki khareedi hui sahulatain aur payment receipts"
audience: all
type: improvement
points:
  - "Package khareedne ke baad us waqt ki sahulatain aur limits mehfooz rehti hain; baad ki package-list tabdeeli se aap ka chalta package nahi badalta."
  - "Tasdeeq-shuda package aur add-on payment ki invoice aur receipt Billing mein dekhein aur download karein."
  - "Digital Invoice mein sirf package chunne se chalta hua paid package khatam nahi hota; payment ki tasdeeq ka mojooda tareeqa istemal hota hai."
