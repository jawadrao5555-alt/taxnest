title: "Rider ki location zyada jaldi aur durust sync hogi"
audience: pos
type: improvement
points:
  - "On-duty GPS aur map ki refresh tez hogi; offline trail apna asal waqt rakhega."
  - "Nayi location purane buffer se pehle sync hogi aur purani request live pin ko peeche nahi karegi."
  - "Package permission aur existing company settings barqarar rahengi."
