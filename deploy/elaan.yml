title: "Receipt ki details apni zaroorat ke mutabiq chunain"
audience: pos
type: improvement
points:
  - "Receipt Settings mein Local aur Fiscal receipt ke liye details aur layout alag chun sakte hain."
  - "Terminal, waiter, table, item columns, logo aur likhai ke mazeed controls milenge."
