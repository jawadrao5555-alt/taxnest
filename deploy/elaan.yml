title: "Reports aur local bill support copies"
audience: all
type: improvement
points:
  - "Admin reports mein company aur product ke mutabiq filters aur bill ki reporting ki halat zyada wazeh hai."
  - "PRA aur FBR POS mein company owner Customize se deleted local bills ki optional support copy khud ON kar sakta hai; pehle se koi company ON nahi hogi."
  - "Owner copy rakhne ki muddat aur ijazat ki aakhri tareekh khud chunta hai; future copies rokne aur purani optional copies purge karne ke alag options hain."
  - "Saved company settings, invoice design aur asal billing records pehle ki tarah rahenge."
