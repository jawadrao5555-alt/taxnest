title: "Day Close ka masla samajhne mein support ke liye behtari"
audience: pos
type: improvement
points:
  - "Day Close mein farq aaye to support ko company, branch aur tareekh batayein. Support saved opening cash, expected cash, gina hua cash aur farq dekh sakti hai."
  - "Purane record mein koi detail na ho to report usay saaf batati hai. Missing detail ko zero nahi maana jata."
  - "Yeh jaanch bills ya cash ka record nahi badalti. Report yeh bhi batati hai ke kaun si jaanch abhi baqi hai."
