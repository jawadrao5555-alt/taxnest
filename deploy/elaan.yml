title: "Mehfooz login aur support case ki behtar jaanch"
audience: all
type: improvement
points:
  - "Two-step login apni marzi se on kar sakte hain. Recovery codes ek martaba dikhte hain; unhein mehfooz jagah rakh lein."
  - "Account Profile se password badalne par doosre purane browsers ko dobara login karna hoga; password badalne wala browser chalta rahega."
  - "Company band karne ki request password se tasdeeq hoti hai; request dete hi account ya bills delete nahi hote."
  - "Support team shikayat ke saath zimmedar afsar, priority, waqt aur related messages ka record rakh sakti hai. Sirf jawab bhejne se shikayat solved mark nahi hoti."
