title: "Bill aur printing ki jaanch mein mazeed tafseel"
audience: all
type: improvement
points:
  - "Ijazat wali reporting connection se bill, order aur printing ke mehfooz records ki jaanch zyada asani se ho sakti hai."
  - "Roz badalne wale L number ka bill dhoondhne ke liye us ki tareekh bhi dein; ek jaisa number dobara ho to dono mumkin bills alag nazar aayenge."
  - "Jis din ka record ya printing ka saboot mojood nahi, report usay wazeh karegi. Purane missing records ya kagaz nikalne ki tasdeeq khud se nahi ki jati."
