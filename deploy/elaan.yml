title: "Bill dobara saada: parcel ke liye item note"
audience: pos
type: improvement
categories:
  - restaurant
  - cafe
  - quick_service
  - hotel
  - marquee
  - catering
  - bakery
points:
  - "Bill bananay ka pehle wala saada tareeqa wapas hai. Ab item ki quantity ko Serve Here, Parcel aur Delivery ke alag hisson mein baantna nahi padega."
  - "Jo item parcel dena ho, us item ke saath note ka chhota button dabayein aur Parcel likh dein. Yeh note usi line ki poori quantity par lagega aur kitchen ki parchi aur bill par nazar aayega."
  - "Misaal: ek pizza parcel aur do yahin khanay ke liye hon to pehle ek pizza add karke us par Parcel note dein, phir do pizza add karein. Naye pizza parcel wale note mein nahi milenge."
  - "Kitchen ko bhejay huay items mein naya item khud se nahi milega. Baad mein item add karke kitchen ko bhejein to add-on par sirf nayi quantity aur us ka note aayega. Pehle bheja hua khana dobara tayyar karne ke liye nahi jayega."
  - "Kitchen ko bhejay huay item ki hidayat badalni ho to order ki correction ya cancellation ka tareeqa istemal karein. Naye item ka note kitchen ko bhejnay se pehle likhein."
  - "Delivery ka bill pehle ki tarah alag banayein. Usi bill par customer ka phone, patta, delivery charges aur rider ka kaam rahega; table wale bill ki raqam ko hisson mein baantna nahi hoga."
  - "Pehle se banay huay bills, unki payment aur rider ka hisaab apni jagah mehfooz hain. Purane bill ka record is tabdeeli se dobara nahi likha jayega."
