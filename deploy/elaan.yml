title: "FBR par report huay bill ka number aur receipt recovery"
audience: pos
type: improvement
points:
  - "Agar bill FBR portal par aa gaya ho lekin TaxNest mein number na aya ho, company admin usi bill ki portal details mila kar number save kar sakta hai. Is se invoice dobara nahi bheji jati."
  - "Recovery ke liye FBR number, POS ID, bill number, date, quantity aur amounts match karna zaroori hai. Save ke baad receipt dobara khol kar PRA aur FBR dono references dekhein."
  - "Desktop Agent ke naye version mein IMS response ki mazeed compatible reading aur response na milne ki wajah record hoti hai. Agent update ke baad yeh tabdeeli lagu hogi."
  - "Reporting khud ON nahi hoti. Purani sale, payment, stock, PRA settings aur Agent pairing apni jagah mehfooz rehte hain."
