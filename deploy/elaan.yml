title: "Agent mein POS aur report save karne ki behtari"
audience: pos
type: improvement
points:
  - "POS na khulne par wazeh paigham aur apni marzi se browser mein kholne ka button milega."
  - "Reports save karte waqt folder poochne ki sahulat Settings se khud ON kar sakte hain; purana download tareeqa pehle ki tarah rahega."
  - "Agent Health mein tamam shamil companies ki ginti aur aakhri rabtay ki maloomat zyada wazeh hogi."
  - "Naye updater mein adhoori update ke liye backup aur recovery ki tayyari shamil hai; saved company aur printer settings barqarar rahengi."
