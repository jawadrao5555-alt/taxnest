title: "PRA login par FBR IMS ki tayari reporting band honay par bhi"
audience: pos
type: improvement
points:
  - "Desktop Agent 1.13.32 mein PRA POS login par FBR IMS setup aur Re-check reporting band honay par bhi milta hai. Service check karne ke liye reporting ON karna zaroori nahi."
  - "Local IMS ki pehchan ke liye mazeed supported metadata address check hota hai. Pehle se chalti PRA connection aur saved settings barqarar rehti hain."
  - "Service milna FBR POS registration aur Sandbox ya Production environment ki tasdeeq nahi. Reporting company ki reviewed settings se hi chalay gi."
