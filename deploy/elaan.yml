title: "Table item delete par duplicate kitchen ADD ki correction"
audience: all
type: fix
points:
  - "Table order mein same dish ki multiple lines ab apne alag line ID se match hoti hain."
  - "Item delete karne par baqi lines dobara ADD nahi hotin; cancellation sirf hatayi hui quantity ki hoti hai."
  - "Order save aur reopen par quantity aur bill total barqarar rehtay hain."
