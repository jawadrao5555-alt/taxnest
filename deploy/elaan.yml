title: "Pending Deliveries aur delivery list kholne ki durusti"
audience: pos
type: fix
points:
  - "Purane mixed delivery bills ki wajah se Pending Deliveries ya delivery list kholte waqt aane wali rukawat door ki gayi hai."
  - "Delivery items aur rider ki raqam pehle ki tarah nazar aayegi; bill ki raqam aur settlement mein koi tabdeeli nahi."
