title: "FBR fiscal device par IMS setup ki pehchan durust"
audience: all
type: improvement
points:
  - "FBR POS ki local fiscal-device setting istemal karne wali company ke liye Agent ko company ki pehchan ab mukammal milti hai, taake Settings mein FBR IMS ka hissa nazar aaye."
  - "Agent 1.13.23 mein IMS service na milay to Install FBR IMS ka button dastiyab hai. Install sirf aapke button dabane par shuru hota hai."
  - "Bill reporting ka tareeqa aur company ya printer ki saved settings nahi badaltin. Yeh website ki correction hai; is ke liye naya Agent installer nahi banaya gaya."
