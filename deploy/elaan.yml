title: "PRA POS: khali call popup aur FBR response compatibility"
audience: pos
type: improvement
points:
  - "Khali 'Yeh number milayein' popup screen par khud nahi khulega. Resize ya fullscreen ke baad band popup band rahega; asal number wala call-back popup kaam karega."
  - "Desktop Agent ke naye version mein mukhtalif supported IMS reply formats se fiscal number parhne ki compatibility behtar ki gayi hai. Conflicting ya adhura jawab dobara invoice bhejne ki wajah nahi banega."
  - "IMS history mein safe response code aur fiscal reference ka record rahega taake number na milne ki wajah check ki ja sake. Purane reported bills dobara nahi bheje jatay."
  - "Reporting settings, printers, pairing, purani sales aur payments apni jagah rehte hain. Agent wali tabdeeli naye Agent update ke baad lagu hogi."
