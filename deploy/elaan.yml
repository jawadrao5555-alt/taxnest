title: "Hotel credit note ka reason, PRA status aur refund balance ab saaf hai"
audience: pos
category: hotel
type: improvement
points:
  - "Pooray bill ka credit note banatay waqt asal wajah enter karein; stay aur money refund alag rehtay hain."
  - "Credit note par PRA accepted, pending ya failed status aur available guest refund raqam saaf nazar aati hai."
  - "58mm, 80mm aur A4 receipt credit amount aur money refunded alag dikhati hai; puranay bills aur settings preserve hain."
