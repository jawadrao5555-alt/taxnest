title: "WhatsApp bill ka optional auto-send aur delivery status"
audience: pos
type: feature
points:
  - "Auto-send default OFF hai; owner package permission ke saath ON/OFF kar sakta hai."
  - "Final bill durable queue se bheja jata hai; manual WhatsApp aur auto-open settings barqarar hain."
  - "Sent, delivered, read aur failure ki halat settings mein nazar aati hai."
  - "Automatic delivery ke liye owner ki Meta configuration aur approved template darkar hain; SENT ka matlab customer delivery nahi."
