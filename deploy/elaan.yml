title: "DI billing periods aur selling packings"
audience: di
type: improvement
points:
  - "Billing page par jis package ke rates set hon, us ke monthly, quarterly, six-month ya annual period ko usi total ke saath select kar sakte hain."
  - "Product mein optional bag, box ya carton ki packing banayein; invoice par Sell By se chunain. Reporting mein us ki asal base quantity aur raqam mehfooz rehti hai."
  - "Packing wali credit note ke liye original invoice ki lines load karein; baad mein packing badalne se purane bill ki conversion nahi badalti."
  - "Buyer ka NTN/CNIC aur sales tax registration alag maloomat hain. Invoice par us ka asal registration status select karein."
  - "Purane bill ki checking ab current, legacy, missing ya failed proof ko alag dikhati hai; sirf bill lock hona tasdeeq ka saboot nahi."
