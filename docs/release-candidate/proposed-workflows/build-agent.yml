name: Build PRA Agent (Windows)
run-name: Build PRA Agent — ${{ inputs.target_sha || github.sha }}
on:
  push:
    branches:
      - main
    paths:
      - 'pra-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact main commit to package (blank means workflow ref)"
        required: false
        type: string
      approval_request_id:
        description: "Owner approval correlation ID, when dispatched after merge"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: build-pra-agent-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: false
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pra-agent
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact requested source commit
        id: release-source
        shell: pwsh
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($env:REQUESTED_SHA) {
            if ($env:REQUESTED_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw "target_sha must be a full 40-character SHA" }
            if ($actual -ne $env:REQUESTED_SHA.ToLowerInvariant()) { throw "Checked out $actual, expected $env:REQUESTED_SHA" }
          }
          git merge-base --is-ancestor $actual origin/main
          if ($LASTEXITCODE -ne 0) { throw "Requested source is not on main" }
          "target_sha=$actual" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          # Node 22 is the tested release-build runtime. Keep it aligned with
          # the lockfile/audit and Electron packaging verification, rather
          # than allowing a runner-default Node version to change artifacts.
          node-version: '22'
      - id: agent-version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid agent semver: $version" }
          $tag = "v$version"
          git show-ref --verify --quiet "refs/tags/$tag"
          $tagLookup = $LASTEXITCODE
          if ($tagLookup -eq 0) {
            $tagTarget = (git rev-list -n 1 $tag).Trim().ToLowerInvariant()
            $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
            if ($tagTarget -eq $actual) {
              "already_released=true" >> $env:GITHUB_OUTPUT
            } else {
              # Tag belongs to an older commit. If versioned Agent source/build
              # inputs are unchanged vs that tag commit, succeed as an
              # idempotent no-build. Never move/overwrite/recreate the tag.
              # defaults.working-directory is pra-agent — compare from repo root.
              Push-Location $env:GITHUB_WORKSPACE
              try {
                git diff --quiet $tagTarget $actual -- pra-agent .github/workflows/build-agent.yml
                $agentDiff = $LASTEXITCODE
              } finally {
                Pop-Location
              }
              if ($agentDiff -eq 0) {
                Write-Host "Tag $tag belongs to $tagTarget; Agent source/build inputs unchanged on $actual — idempotent no-build."
                "already_released=true" >> $env:GITHUB_OUTPUT
              } elseif ($agentDiff -eq 1) {
                throw "Release $tag already belongs to $tagTarget and Agent source/build inputs changed on $actual; bump package version"
              } else {
                throw "git diff failed with exit code $agentDiff while comparing Agent inputs for $tag"
              }
            }
          } elseif ($tagLookup -eq 1) {
            "already_released=false" >> $env:GITHUB_OUTPUT
          } else {
            throw "git show-ref failed with exit code $tagLookup while looking up $tag"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
      - if: ${{ steps.agent-version.outputs.already_released != 'true' }}
        run: npm install
      - if: ${{ steps.agent-version.outputs.already_released != 'true' }}
        run: npm run build:win
      - name: Zip portable folder
        if: ${{ steps.agent-version.outputs.already_released != 'true' }}
        shell: pwsh
        run: |
          if (Test-Path dist/win-unpacked) {
            Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/TaxNest-PRA-Agent-Windows.zip -Force
          }
      - name: Create canonical release manifest
        if: ${{ steps.agent-version.outputs.already_released != 'true' }}
        shell: pwsh
        env:
          VERSION: ${{ steps.agent-version.outputs.version }}
          SOURCE_SHA: ${{ steps.release-source.outputs.target_sha }}
        run: |
          $zip = Get-Item "dist/TaxNest-PRA-Agent-Windows.zip" -ErrorAction Stop
          $exeName = "TaxNest-Agent-Setup-$env:VERSION.exe"
          $exe = Get-Item (Join-Path "dist" $exeName) -ErrorAction Stop
          $assets = @($zip, $exe) | ForEach-Object {
            [ordered]@{
              name = $_.Name
              sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              size = [int64]$_.Length
            }
          }
          $manifest = [ordered]@{
            schema_version = 1
            product = "taxnest-pra-agent"
            version = $env:VERSION
            source_sha = $env:SOURCE_SHA.ToLowerInvariant()
            build_sha = $env:SOURCE_SHA.ToLowerInvariant()
            compatibility = [ordered]@{
              min_agent_version = "1.3.0"
              max_agent_version = "2.99.99"
            }
            assets = $assets
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "dist/release-manifest.json" -Encoding utf8
      - name: Upload to release
        if: ${{ steps.agent-version.outputs.already_released != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.agent-version.outputs.version }}
          target_commitish: ${{ steps.release-source.outputs.target_sha }}
          name: TaxNest PRA Agent v${{ steps.agent-version.outputs.version }}
          body_path: pra-agent/CHANGELOG.md
          files: |
            pra-agent/dist/*.exe
            pra-agent/dist/TaxNest-PRA-Agent-Windows.zip
            pra-agent/dist/release-manifest.json
          draft: false
          prerelease: false
          make_latest: true
      - name: Report idempotent existing release
        if: ${{ steps.agent-version.outputs.already_released == 'true' }}
        shell: pwsh
        run: Write-Host "Agent v${{ steps.agent-version.outputs.version }} is already released from this exact SHA; no assets were replaced."