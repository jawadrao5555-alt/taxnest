// TaxNest FBR POS — root build script
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    // Firebase push (Task #1283): declared here, applied by app/build.gradle
    // ONLY when app/google-services.json (owner's Firebase config drop-in,
    // Android app entry pk.taxnest.fbrpos in the SAME project as the rider
    // app) exists — build works without it.
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
