plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing: keystore path/password from env (same stable key as the rider app —
// .local/rider-signing/, gitignored; repo is PUBLIC, never commit a keystore).
def ciKeystore = System.getenv("RIDER_KS")
def ciKeystorePass = System.getenv("RIDER_KS_PASS")

android {
    namespace 'pk.taxnest.pos'
    compileSdk 34

    defaultConfig {
        applicationId "pk.taxnest.pos"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.1.1"
    }

    buildFeatures {
        // MainActivity appends BuildConfig.VERSION_NAME to the UA (update banner
        // detection) — AGP 8 disables BuildConfig generation by default.
        buildConfig true
    }

    signingConfigs {
        ciRelease {
            if (ciKeystore != null) {
                storeFile file(ciKeystore)
                storePassword ciKeystorePass
                keyAlias "rider"
                keyPassword ciKeystorePass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ciKeystore != null) {
                signingConfig signingConfigs.ciRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Previously deliberately dependency-free. v1.1.0 (Task #1142) adds ONLY
    // Firebase messaging for instant push (naya order / order tayyar /
    // day-close). Notifications are built with the framework
    // Notification.Builder — no androidx UI deps. The dependency is always on
    // the classpath; without google-services.json Firebase simply never
    // initializes and Push.kt catches the resulting exceptions (silent no-op,
    // same pattern as the rider app).
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
}

// Firebase config activates ONLY when the owner drops in the real
// app/google-services.json (Firebase console → same project as rider app →
// Android app pk.taxnest.pos). Conditional apply keeps DEBUG builds green
// without it — push stays dormant, everything else works (Task #1142).
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Task #1399: a RELEASE may NOT be push-dead. The guard blocks assembleRelease
// when the config is missing, and re-opens the finished APK to prove Firebase
// really landed inside it (the rider shell shipped a push-dead v1.6.0 exactly
// this way; this shell is built from the same pattern).
apply from: file("$rootDir/../scripts/lib/android-firebase-guard.gradle")
