plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI signing: keystore path/password come from env (generated per-build for
// the beta; stable key via repo secret before GA — repo is PUBLIC, never
// commit a keystore here).
def ciKeystore = System.getenv("RIDER_KS")
def ciKeystorePass = System.getenv("RIDER_KS_PASS")

android {
    namespace 'pk.taxnest.rider'
    compileSdk 34

    defaultConfig {
        applicationId "pk.taxnest.rider"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "1.7.3"
    }

    signingConfigs {
        ciRelease {
            if (ciKeystore != null) {
                storeFile file(ciKeystore)
                storePassword ciKeystorePass
                keyAlias "rider"
                keyPassword ciKeystorePass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ciKeystore != null) {
                signingConfig signingConfigs.ciRelease
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // v1.4.0: background delivery-check job (15-min periodic)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    // v1.5.0 (Task #1106): instant new-delivery push. Compiles WITHOUT
    // google-services.json; at runtime Fcm.kt catches the "not initialized"
    // throw so a config-less build silently falls back to the 15-min poll.
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
    // QR is encoded entirely on-device from the server allowlisted bare payload.
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}

// Task #1106: Google Services plugin can only run with a real
// google-services.json (owner's Firebase console download). Conditional apply
// keeps DEBUG builds green before the config drop-in exists — push simply
// stays dormant and DeliveryCheckWorker keeps covering notifications.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// Task #1399: a RELEASE may NOT be push-dead. The guard blocks assembleRelease
// when the config is missing, and re-opens the finished APK to prove Firebase
// really landed inside it — v1.6.0 shipped to riders without it and instant
// push was silently dead on every phone.
apply from: file("$rootDir/../scripts/lib/android-firebase-guard.gradle")
